<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171A1F">
<meta name="description" content="Home Strength Blueprint — an 11-minute daily strength workout you can do with bodyweight, bands, or dumbbells.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Strength Blueprint</title>
<style>
/* ================================================================= TOKENS */
:root{
  --paper:#F4F3EF; --card:#FFFFFF; --ink:#171A1F; --muted:#5E6167;
  --hair:#C9C8C2; --accent:#5C6470;
  --plateA:#C0392B; --plateB:#1F4E9C; --plateC:#D9A413; --plateD:#2E7D4B; --plateE:#5C6470;
  --radius:12px; --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --head:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#15171B; --card:#1E2127; --ink:#F0F0EC; --muted:#9A9DA4; --hair:#33373E; }
}
:root[data-theme="dark"]{ --paper:#15171B; --card:#1E2127; --ink:#F0F0EC; --muted:#9A9DA4; --hair:#33373E; }
:root[data-theme="light"]{ --paper:#F4F3EF; --card:#FFFFFF; --ink:#171A1F; --muted:#5E6167; --hair:#C9C8C2; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.33;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:.01em}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 0 calc(60px + var(--safe-b))}

/* ================================================================= HEADER */
header.top{
  position:sticky;top:0;z-index:20;background:var(--paper);
  display:flex;align-items:center;gap:8px;
  padding:8px 12px 7px;border-bottom:1px solid var(--hair);
}
header.top .title{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;flex:1}
header.top .title small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.icon-btn{
  width:40px;height:40px;min-width:40px;
  border:1px solid var(--hair);border-radius:10px;background:var(--card);
  display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:20px;height:20px}

/* ================================================================= BANDS / CHIPS */
.band{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--paper);
  padding:5px 11px;border-radius:999px;
  font-family:var(--head);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.25;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--card);border:1px solid var(--hair);color:var(--muted);
}
.chip.solid{background:var(--accent);color:#fff;border-color:transparent}

/* ================================================================= CARDS */
main{padding:12px}
.card{
  background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);
  padding:11px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.card + .card{margin-top:10px}
.section-h{
  font-family:var(--head);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--paper);background:var(--ink);border-radius:999px;
  padding:4px 10px;display:inline-block;margin:13px 0 7px;
}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ================================================================= EXERCISE ROW */
.ex{
  display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);
}
.ex:last-child{border-bottom:0}
.ex .badge{
  width:24px;height:24px;min-width:24px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--head);font-weight:900;font-size:13px;color:#fff;
}
.ex .pico{width:44px;height:32px;min-width:44px}
.ex .exbody{flex:1;min-width:0}
.ex .exname{font-weight:700;font-size:14px}
.ex .excue{font-size:11.5px;color:var(--muted);margin-top:0}
.ex .extarget{font-size:12px;margin-top:2px}
.ex .extarget b{color:var(--ink)}
.ex .sug{color:var(--plateD);font-weight:700}

.pico svg{width:100%;height:100%;display:block}

/* ================================================================= BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:var(--tap);padding:10px 14px;border-radius:10px;
  border:1px solid transparent;font-weight:800;font-size:14px;
  font-family:var(--head);letter-spacing:.03em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);
}
.btn.secondary{background:var(--card);color:var(--ink);border-color:var(--hair)}
.btn.accent{background:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:700}
.btn.danger{background:var(--plateA)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin-top:0}
.btn:active{transform:translateY(1px)}

/* streak */
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-family:var(--head)}
.streak .flame{font-size:17px}

/* ================================================================= TAB BAR */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--hair);
  display:flex;padding-bottom:var(--safe-b);
  max-width:720px;margin:0 auto;
}
nav.tabs button{
  flex:1;background:none;border:0;padding:6px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-height:50px;
}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.active{color:var(--ink)}
nav.tabs button.active svg{stroke:var(--ink)}

section[hidden]{display:none}

/* ================================================================= PLAYER OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:50;background:var(--paper);
  display:flex;flex-direction:column;padding:0 20px calc(20px + var(--safe-b));
  overflow:auto;
}
.overlay .obar{display:flex;align-items:center;gap:12px;padding:16px 0 4px}
.overlay .obar .phase{flex:1;font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0}
.ring{position:relative;width:min(74vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--hair);stroke-width:8}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.reduced .ring .prog{transition:none}
.ring .center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.ring .time{font-family:var(--head);font-weight:900;font-size:56px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .sub{font-size:13px;color:var(--muted);margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.player-ex{text-align:center;margin-top:6px}
.player-ex .pbig{width:120px;height:88px;margin:0 auto}
.player-ex .pname{font-family:var(--head);font-weight:800;font-size:22px;margin-top:6px}
.player-ex .pcue{color:var(--muted);font-size:14px;margin-top:4px;max-width:340px;margin-left:auto;margin-right:auto}
.player-ex .ptarget{margin-top:8px;font-weight:800;font-family:var(--head);letter-spacing:.03em}
.player-list{margin:10px auto;max-width:360px;text-align:left}
.player-list li{padding:6px 0;border-bottom:1px solid var(--hair);font-size:15px}
.player-ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto;padding-top:16px}
.player-ctrls .btn{margin-top:0}
.player-ctrls .wide{grid-column:1 / -1}

/* dialog */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--muted);margin:0 0 16px}

/* quick-log sheet */
.log-ex{display:grid;grid-template-columns:1fr;gap:5px;padding:8px 0;border-bottom:1px solid var(--hair)}
.log-ex .lname{font-weight:700;font-size:14px}
.log-ex .sets{display:flex;gap:6px;flex-wrap:wrap}
.log-ex .setin{display:flex;flex-direction:column;gap:2px}
.log-ex .setin label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.log-ex input{
  width:64px;text-align:center;padding:8px 5px;border:1px solid var(--hair);border-radius:9px;
  background:var(--paper);color:var(--ink);
}
.lset{margin-top:8px}
.lset .lshead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lset .setn{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:38px}
.reppad{display:flex;gap:5px;overflow-x:auto;padding:2px 1px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.reppad button{
  flex:0 0 auto;min-width:36px;height:36px;border-radius:9px;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;
}
.reppad button.on{background:var(--accent);color:#fff;border-color:transparent}
.reppad .repcap{font-size:11px;color:var(--muted);align-self:center;padding:0 4px;font-weight:700}

/* ================================================================= QUICK SESSION */
.qsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.qsgrid .field{margin-bottom:8px}
.lrow .pico{width:44px;height:33px;min-width:44px}

/* ================================================================= PROGRESS */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .hd{aspect-ratio:1;border-radius:4px;background:var(--hair);cursor:pointer}
.heat .hd.rest{background:transparent;border:1px dashed var(--hair)}
.heat .hd.partial{background:#9ec9ad}
.heat .hd.full{background:var(--plateD)}
.heat .hd.future{background:transparent}
.heatlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.heatlabels span{text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.spark{width:100%;height:36px;display:block;margin-top:6px}
.histlog{padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.histlog .hdate{color:var(--muted);font-size:11.5px}

/* settings */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-weight:700;font-size:13px}
.field input,.field select,.field textarea{
  padding:9px 10px;border:1px solid var(--hair);border-radius:9px;background:var(--paper);color:var(--ink);width:100%;
}
.field textarea{min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair)}
.switch{position:relative;width:52px;height:30px}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--hair);border-radius:999px;transition:.2s}
.switch .sl:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .sl{background:var(--plateD)}
.switch input:checked + .sl:before{transform:translateX(22px)}
.seg{display:flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px;background:var(--paper);border:0;font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:9px 11px}
.kpi b{display:block;font-family:var(--head);font-size:21px;font-weight:900;letter-spacing:-.01em;line-height:1}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* achievements */
.achs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.ach{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;opacity:.32;filter:grayscale(1)}
.ach.on{opacity:1;filter:none}
.ach .aic{font-size:20px;line-height:1}
.ach .alab{font-size:8.5px;color:var(--muted);font-weight:700;line-height:1.1}
/* compact list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .lr-main{flex:1;min-width:0}
.lrow .lr-name{font-weight:700}
.lrow .lr-sub{font-size:11.5px;color:var(--muted)}
.lrow .lr-val{font-family:var(--head);font-weight:800;text-align:right}
.lrow .lr-val small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
/* mini goal ring */
/* workout-type picker */
.typopt{
  display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:7px;
  border:1.5px solid var(--hair);border-radius:12px;background:var(--card);cursor:pointer;
}
.typopt.on{border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.typopt .tl{
  width:34px;height:34px;min-width:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--head);font-weight:900;font-size:13px;letter-spacing:.02em;color:#fff;
}
.typopt.on .tl{background:rgba(255,255,255,.22)!important}
.typopt .tmeta{flex:1;min-width:0}
.typopt .tnm{font-weight:800;font-size:14px;line-height:1.15}
.typopt .tsub{font-size:11.5px;color:var(--muted);margin-top:1px}
.typopt.on .tsub{color:rgba(255,255,255,.9)}
.typopt .tck{font-weight:900;font-size:16px;opacity:0}
.typopt.on .tck{opacity:1}
/* swap chips */
.swap{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.swap button{
  flex:1;min-width:44px;padding:8px 0;border-radius:9px;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);font-family:var(--head);font-weight:900;font-size:15px;
}
.swap button.on{color:#fff;border-color:transparent}
.inline-note{font-size:11.5px;color:var(--muted);margin-top:6px}
/* day detail rows in modal */
.dd-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px}
.dd-row:last-child{border-bottom:0}
/* floating quick-log button */
.fab{
  position:fixed;z-index:35;bottom:calc(62px + var(--safe-b));
  right:max(16px, calc(50vw - 360px + 16px));
  width:52px;height:52px;border-radius:50%;border:0;
  background:var(--ink);color:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.32);
  display:flex;align-items:center;justify-content:center;
}
.fab svg{width:26px;height:26px}
.fab:active{transform:translateY(1px)}
/* quick-log picker */
.qchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.qchip{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;border:1.5px solid var(--hair);background:var(--paper);color:var(--ink);font-weight:700;font-size:13px}
.qchip.on{background:var(--ink);color:var(--paper);border-color:transparent}
.modal .pico{width:40px;height:30px;min-width:40px}
.modal{max-height:88vh;overflow:auto}

/* pictogram helpers */
.fig{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.gnd{stroke:#C9C8C2;stroke-width:3;stroke-linecap:round}
.eq{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.eqf{fill:var(--accent);stroke:none}
.mo{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="title">Strength Blueprint<small id="hdrSub">Home · 11 min</small></div>
    <button class="icon-btn" id="gearBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <section id="view-today"></section>
    <section id="view-quick" hidden></section>
    <section id="view-progress" hidden></section>
    <section id="view-settings" hidden></section>
  </main>
</div>

<nav class="tabs">
  <button data-tab="today" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l2-2 4 4 8-8 2 2"/><path d="M4 20h16"/></svg>
    Today
  </button>
  <button data-tab="quick">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>
    Quick
  </button>
  <button data-tab="progress">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    Progress
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
    Settings
  </button>
</nav>

<button class="fab" id="fabQuick" aria-label="Quick log">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- overlays get injected here -->
<div id="overlayRoot"></div>
<div id="modalRoot"></div>

<!-- ================================================================= SVG PICTOGRAM SHEET -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<!-- viewBox 0 0 100 70, ground y=64. Ids p{row}{pic}: pic 0 = dumbbells, 1 = bands, 2 = bodyweight -->

<script>
"use strict";
(function(){
/* ================================================================= DATA */
// Three kits. Every kit runs the same five movement patterns (rows). Each slot
// has a base move plus swappable alternates. `pic` picks the pictogram column
// from the SVG sheet (0 = dumbbell figures, 1 = band, 2 = bodyweight).
const COLUMNS = [
  { id:"BW", name:"Bodyweight", equipment:"no equipment",     color:"#D9A413", pic:2, ceiling:15 },
  { id:"BD", name:"Bands",      equipment:"resistance bands", color:"#1F4E9C", pic:1, ceiling:15 },
  { id:"DB", name:"Dumbbells",  equipment:"dumbbells",        color:"#C0392B", pic:0, ceiling:10 },
];
const ROWS = ["Squat","Hinge","Push","Pull","Core"];
// LIB[kit][row] = [ {n:name, c:cue}, ...alternates ]. The first entry is the default.
const LIB = {
  BW: [
    [{n:"Bodyweight Squat",c:"Feet shoulder-width, sit back, chest up, full depth"},
     {n:"1.5-Rep Squat",c:"Down, halfway up, back down, then stand — that's one rep"},
     {n:"Squat Jump",c:"Explode up, land soft with bent knees, reset each rep"},
     {n:"Reverse Lunge",c:"Step back, drop the back knee, drive the front heel"},
     {n:"Cossack Squat",c:"Shift side to side, one leg bends, one stays straight"}],
    [{n:"Glute Bridge",c:"Feet flat, drive hips up, squeeze the glutes at the top"},
     {n:"Single-Leg Glute Bridge",c:"One foot planted, drive hips up, squeeze the glute at the top"},
     {n:"Glute Bridge March",c:"Hips up, march one knee at a time, hips stay level"},
     {n:"Broad Jump",c:"Swing the arms, jump forward for distance, stick the landing"}],
    [{n:"Push-Up",c:"Hands under shoulders, chest to floor, press up strong"},
     {n:"Incline Push-Up",c:"Hands on a bench, lower slow, full lockout"},
     {n:"Tempo Push-Up",c:"Three seconds down, chest to floor, press up strong"},
     {n:"Diamond Push-Up",c:"Hands together under the chest, elbows tight"},
     {n:"Plyo Push-Up",c:"Explode off the floor, hands leave, land soft and reset"}],
    [{n:"Towel Door Row",c:"Towel round the handle, lean back, pull your chest to the door"},
     {n:"Doorway Row",c:"Hold the frame, lean back, pull your chest in"},
     {n:"Table Inverted Row",c:"Under a sturdy table, pull chest to the edge, body straight"},
     {n:"Prone Y-T-W",c:"Face down, lift the arms in Y, T then W shapes"}],
    [{n:"Plank",c:"Elbows under shoulders, squeeze glutes, hold rock solid"},
     {n:"Slow Dead Bug",c:"Low back pinned down, extend opposite arm and leg slowly"},
     {n:"Hollow Hold",c:"Low back pinned, arms and legs off the floor, hold"},
     {n:"Mountain Climbers",c:"Strong plank, drive the knees fast, keep the hips level"},
     {n:"Bird Dog",c:"Opposite arm and leg out, slow and steady, flat back"}],
  ],
  BD: [
    [{n:"Banded Squat",c:"Band under feet, drive your knees out against the band"},
     {n:"Banded Split Squat",c:"Band under the front foot, drop straight down"},
     {n:"Wall Sit",c:"Back on the wall, thighs parallel, hold and breathe"}],
    [{n:"Band Good Morning",c:"Band on your traps, hinge at the hips, load the hamstrings"},
     {n:"Band Pull-Through",c:"Band between the legs, snap the hips forward"},
     {n:"Band RDL",c:"Stand on the band, hinge back, feel the hamstrings"}],
    [{n:"Band Overhead Press",c:"Band under feet, press overhead, keep your ribs down"},
     {n:"Band Chest Press",c:"Band behind your back, press straight forward"},
     {n:"Banded Push-Up",c:"Band across your back, push up against the extra tension"}],
    [{n:"Band Lat Pulldown",c:"Anchor the band high, pull your elbows down to your ribs"},
     {n:"Band Seated Row",c:"Band round the feet, row to the waist, squeeze"},
     {n:"Band Face Pull",c:"Pull to your forehead, elbows high, open the shoulders"}],
    [{n:"Pallof Press",c:"Band at chest from the side, press out, resist the twist"},
     {n:"Band Woodchop",c:"Band from high to low across the body, rotate"},
     {n:"Band Anti-Rotation Hold",c:"Arms out, resist the band's pull, don't twist"}],
  ],
  DB: [
    [{n:"Goblet Squat",c:"DB at chest, elbows inside knees, sit between your heels"},
     {n:"DB Front Squat",c:"DBs racked on your shoulders, sit tall and deep"},
     {n:"DB Reverse Lunge",c:"DBs at your sides, step back and drop under control"},
     {n:"DB Bulgarian Split Squat",c:"Rear foot on a box, drop straight down over the front heel"},
     {n:"DB Step-Up",c:"Drive through the top foot, stand tall, lower slow"}],
    [{n:"DB Romanian Deadlift",c:"Soft knees, push hips back, DBs graze the thighs, flat back"},
     {n:"DB Single-Leg RDL",c:"Hinge over one leg, DB tracks the shin, hips square"},
     {n:"DB Sumo Deadlift",c:"Wide stance, DB between the feet, push the floor away"},
     {n:"DB Swing",c:"Hike the DB back, snap the hips forward, arms stay relaxed"}],
    [{n:"DB Floor Press",c:"Back on the floor, press the DBs up, elbows stop at the ground"},
     {n:"DB Overhead Press",c:"Press the DBs overhead, ribs down, don't arch"},
     {n:"DB Floor Fly",c:"Wide arc, soft elbows, squeeze the chest at the top"},
     {n:"DB Handle Push-Up",c:"Grip DBs on the floor for a deeper range, press strong"}],
    [{n:"Bent-Over DB Row",c:"Hinge forward, pull DBs to your hips, squeeze shoulder blades"},
     {n:"DB Single-Arm Row",c:"Hand on a support, row the DB to your hip"},
     {n:"DB Gorilla Row",c:"Hinge over two DBs, row one then the other"},
     {n:"Renegade Row",c:"Plank on the DBs, row one up, keep your hips square"}],
    [{n:"Suitcase Carry",c:"One DB at your side, walk tall, don't lean or tilt"},
     {n:"Farmer Hold",c:"Heavy DBs at your sides, brace hard and stand tall"},
     {n:"DB Side Bend",c:"DB in one hand, bend to the side, stand tall again"},
     {n:"Plank DB Drag",c:"Plank over a DB, drag it side to side, hips stay still"}],
  ],
};
// The workout: the five moves, twice through, 45s on / 15s off, one 60s
// breather between the rounds. No warm-up phase, no cool-down phase.
const WORK_SEC = 45, REST_SEC = 15, BREAK_SEC = 60, ROUNDS = 2;
const SESSION_TOTAL = ROUNDS*5*WORK_SEC + (ROUNDS*5-2)*REST_SEC + BREAK_SEC; // 10:30
// exercise-library accessors (base move + alternates, per slot)
function exOptions(r,c){ return LIB[COLUMNS[c].id][r]; }
function exPickKey(r,c){ return r+"-"+COLUMNS[c].id; }
function exPickIdx(r,c){ const opts=exOptions(r,c); const i=(S.settings.exPick&&S.settings.exPick[exPickKey(r,c)])||0; return (i>=0&&i<opts.length)?i:0; }
function currentEx(r,c){ return exOptions(r,c)[exPickIdx(r,c)]; }
function cycleEx(r,c){ const opts=exOptions(r,c); if(!S.settings.exPick)S.settings.exPick={}; S.settings.exPick[exPickKey(r,c)]=(exPickIdx(r,c)+1)%opts.length; save(); }
function pickedColumn(){ return colById(S.settings.pickedCol) ? S.settings.pickedCol : COLUMNS[0].id; }
// common bodyweight moves for quick sessions & quick logging (pr/pc pick the pictogram)
const QUICK = [
  { n:"Push-Ups", pr:2, pc:0 }, { n:"Bodyweight Squats", pr:0, pc:0 },
  { n:"Lunges", pr:0, pc:0 }, { n:"Pull-Ups", pr:3, pc:0 },
  { n:"Sit-Ups", pr:4, pc:0 }, { n:"Burpees", pr:0, pc:0 }, { n:"Dips", pr:2, pc:0 },
];
// quick-session presets: sets × reps with a rest between sets
const QS_PRESETS = [
  { id:"5x5",   sets:5,  reps:5,  rest:30 },
  { id:"3x10",  sets:3,  reps:10, rest:45 },
  { id:"10x10", sets:10, reps:10, rest:60 },
];

/* ================================================================= STORE */
const KEY = "hsb.v1";
function defaultState(){
  return {
    settings:{ units:"kg", pickedCol:"BW", sound:true, vibrate:true,
               theme:"system", exPick:{}, schema:2,
               quick:{ ex:null, sets:5, reps:5, rest:30, timed:false, work:45 } },
    logs:[], snacksDone:{}, sessionsDone:{}, bodyweight:[], achievements:[]
  };
}
// v1 stored five lettered kits (A Dumbbells, B Bands, C/D No Equipment, E Full
// Kit). Map them onto the three kits so old logs keep their load type.
const V1_COL = { A:"DB", B:"BD", C:"BW", D:"BW", E:"DB" };
function migrateCol(c){ return colById(c) ? c : (V1_COL[c] || "BW"); }
let S = defaultState();
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
  if(!raw){ S = defaultState(); save(); return; }
  try {
    const parsed = JSON.parse(raw);
    S = migrate(parsed);
  } catch(e){
    try { localStorage.setItem(KEY+".corrupt", raw); } catch(_){}
    S = defaultState(); save();
  }
}
function migrate(obj){
  const d = defaultState();
  if(!obj || typeof obj !== "object") return d;
  const s = Object.assign({}, d.settings, obj.settings || {});
  s.quick = Object.assign({}, d.settings.quick, (obj.settings && obj.settings.quick) || {});
  if(s.quick.ex && !colById(s.quick.ex.col)) s.quick.ex = null;
  const logs = Array.isArray(obj.logs) ? obj.logs : [];
  const sessionsDone = (obj.sessionsDone && typeof obj.sessionsDone==="object") ? obj.sessionsDone : {};
  if(!(obj.settings && obj.settings.schema >= 2)){
    s.pickedCol = migrateCol(s.pickedCol);
    logs.forEach(l=>{ l.col = migrateCol(l.col); });
    Object.keys(sessionsDone).forEach(k=>{ sessionsDone[k] = migrateCol(sessionsDone[k]); });
    s.exPick = {}; // v1 swaps indexed a different library; start from the defaults
    delete s.interval; delete s.weeklyGoal;
    s.schema = 2;
  }
  return {
    settings:s,
    logs,
    snacksDone: (obj.snacksDone && typeof obj.snacksDone==="object") ? obj.snacksDone : {}, // legacy v1 days, kept for the heatmap
    sessionsDone,
    bodyweight: Array.isArray(obj.bodyweight) ? obj.bodyweight : [],
    achievements: Array.isArray(obj.achievements) ? obj.achievements : [],
  };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ /* quota / private mode */ }
}

/* ================================================================= CLOCK */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ const p=(s||"").split("-"); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); }
function addDays(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function colById(id){ return COLUMNS.find(c=>c.id===id); }

/* ================================================================= PROGRESSION */
function loadType(col){
  if(!col) return "bw";
  if(/dumbbell/.test(col.equipment)) return "db";
  if(/band/.test(col.equipment)) return "band";
  return "bw";
}
function lastLogFor(exName){
  for(let i=S.logs.length-1;i>=0;i--){ if(S.logs[i].exercise===exName) return S.logs[i]; }
  return null;
}
// one logged set as text: "12kg×8", "BW×15", or "45s" for a timed set
function fmtSet(s, lt){
  const w = +s.w||0, r = +s.r||0;
  if(!r && s.sec) return (+s.sec)+"s";
  return (w ? fmtWeight(w,lt) : "BW") + "×" + r;
}
function fmtWeight(w, lt){
  if(lt==="bw") return "BW";
  if(w===null || w===undefined || w==="") return "—";
  if(lt==="band") return "L"+w;              // band level
  return w + S.settings.units;
}
// AMRAP model: no prescribed reps. Each working set is "as many good reps as
// you can in 45s". The kit's rep ceiling is the only number: once you clear it,
// you're told to add load (double progression) — never an exact count to hit.
const SESSION_SETS = ROUNDS; // two rounds = two working sets per move
function computeTarget(rowIdx, colIdx){
  const col = COLUMNS[colIdx];
  const exName = currentEx(rowIdx, colIdx).n;
  const high = col.ceiling;
  const lt = loadType(col);
  const inc = S.settings.units==="kg" ? 2.5 : 5;
  const last = lastLogFor(exName);
  let weight = null, sug = "", beat = null;

  if(last && last.sets && last.sets.length){
    const reps  = last.sets.map(s=> +s.r || 0);
    const ws    = last.sets.map(s=> +s.w || 0);
    const lastW = Math.max.apply(null, ws.concat([0]));
    const bestRep = Math.max.apply(null, reps);
    weight = (lt==="bw") ? null : (lastW>0 ? lastW : null);
    const cleared = bestRep >= high; // beat the rep ceiling last time
    if(cleared){
      if(lt==="db"){ weight = (weight||0)+inc; sug = "add "+inc+S.settings.units; }
      else if(lt==="band"){ sug = "next band up"; }
      else { sug = "slow the tempo or swap ⇄ harder"; }
    } else {
      beat = bestRep; // otherwise just beat your best set
    }
  }
  return { col, exName, lt, last, high, weight, sug, beat, sets:SESSION_SETS };
}
function targetLineHTML(t){
  const w = fmtWeight(t.weight, t.lt);
  const today = (t.lt==="bw") ? "AMRAP" : ("AMRAP @ " + (t.weight!=null ? w : "pick a weight"));
  let html;
  if(t.last && t.last.sets && t.last.sets.length){
    const lw = fmtWeight(Math.max.apply(null, t.last.sets.map(s=>+s.w||0).concat([0])) || null, t.lt);
    const reps = t.last.sets.map(s=> +s.r||0).join(",");
    html = "Last: <b>"+lw+" × "+reps+"</b> → <b>"+today+"</b>";
  } else {
    html = "<b>"+today+"</b>";
  }
  if(t.sug) html += ' <span class="sug">↑ '+t.sug+'</span>';
  else if(t.beat!=null) html += ' <span class="sug">beat '+t.beat+'</span>';
  return html;
}

/* ================================================================= STREAK & COMPLETION */
function allSnacks(iso){ const a=S.snacksDone[iso]; return a && a.length>=5; } // legacy v1 snack days
function quickCount(iso){ let n=0; for(const l of S.logs) if(l.date===iso && l.mode==="quick") n++; return n; }
// "activity" = quick sessions + ad-hoc quick logs done that day (+ legacy snack ticks)
function activityCount(iso){ return (S.snacksDone[iso]?S.snacksDone[iso].length:0) + quickCount(iso); }
function dayComplete(iso){ return !!S.sessionsDone[iso] || activityCount(iso)>=3; }
function dayLevel(iso){ // 0 nothing, 1 some activity, 2 full
  if(S.sessionsDone[iso] || allSnacks(iso) || activityCount(iso)>=3) return 2;
  if(activityCount(iso)>0) return 1;
  return 0;
}
function currentStreak(){
  let n=0, d=new Date();
  if(!dayComplete(todayISO())) d = addDays(d,-1);
  while(dayComplete(isoOf(d))){ n++; d = addDays(d,-1); }
  return n;
}
function longestStreak(){
  const keys = {};
  Object.keys(S.sessionsDone).forEach(k=> keys[k]=1);
  Object.keys(S.snacksDone).forEach(k=> keys[k]=1);
  S.logs.forEach(l=>{ if(l.mode==="quick") keys[l.date]=1; });
  const days = Object.keys(keys).filter(dayComplete);
  const set = {}; days.forEach(k=> set[k]=1);
  let best=0;
  days.forEach(k=>{
    if(set[isoOf(addDays(parseISO(k),-1))]) return; // not a run start
    let n=0, d=parseISO(k);
    while(set[isoOf(d)]){ n++; d=addDays(d,1); }
    if(n>best) best=n;
  });
  return best;
}

/* ================================================================= STATS / PRs / EFFECTIVE COLUMN */
function totalSessions(){ return Object.keys(S.sessionsDone).length; }
function weekStart(d){ const dow=(d.getDay()+6)%7; return addDays(d,-dow); } // Monday
function inThisWeek(iso){
  const d=parseISO(iso), m=weekStart(new Date());
  return stripTime(d) >= stripTime(m) && stripTime(d) <= stripTime(addDays(m,6));
}
function sessionsThisWeek(){ return Object.keys(S.sessionsDone).filter(inThisWeek).length; }
function volumeThisWeek(){
  return S.logs.filter(l=>inThisWeek(l.date))
    .reduce((a,l)=> a + l.sets.reduce((b,s)=> b+(+s.w||0)*(+s.r||0),0), 0);
}
function est1RM(w,r){ return (w>0&&r>0) ? w*(1+r/30) : 0; }
// best set (by est 1RM) for an exercise across logs, optionally excluding the last N
function bestSet(exName, logsArr){
  const arr = logsArr || S.logs;
  let best=null;
  arr.forEach(l=>{ if(l.exercise!==exName) return;
    l.sets.forEach(s=>{ const e=est1RM(+s.w||0,+s.r||0);
      if(e>0 && (!best || e>best.e)) best={ w:+s.w, r:+s.r, e, date:l.date, lt:loadType(colById(l.col)) };
    });
  });
  return best;
}

      S.achievements.push(a.id);
      if(!silent) toast(a.icon+" Badge: "+a.name);
    }
  });

// detect new personal records among a freshly-added batch of logs
function detectPRs(newLogs){
  const prior = S.logs.slice(0, S.logs.length - newLogs.length);
  const hits = [];
  newLogs.forEach(l=>{
    const before = bestSet(l.exercise, prior);
    l.sets.forEach(s=>{
      const e = est1RM(+s.w||0,+s.r||0);
      if(e>0 && (!before || e>before.e+0.01) && hits.indexOf(l.exercise)<0) hits.push(l.exercise);
    });
  });
  return hits;
}

/* ================================================================= AUDIO */
let AC = null;
function beep(freq, dur, when){
  if(!S.settings.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t = AC.currentTime + (when||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.15));
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+(dur||0.15)+0.02);
  }catch(e){}
}
function cueChime(){ beep(660,0.12,0); beep(880,0.14,0.13); }
function cueRestEnd(){ beep(520,0.1,0); beep(700,0.1,0.12); beep(920,0.16,0.24); }
function vibrate(ms){ if(S.settings.vibrate && navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

function clampInt(v,lo,hi,dflt){ v=parseInt(v,10); if(isNaN(v)) v=dflt; return Math.max(lo,Math.min(hi,v)); }
function qsConfig(){

function renderHistBody(name){
  const body = document.getElementById("histBody");
  if(!body) return;
  const logs = S.logs.filter(l=>l.exercise===name);
  let html = "";
  // sparkline of est volume
  const vols = logs.map(l=> l.sets.reduce((a,s)=> a + (+s.w||0)*(+s.r||0), 0));
  const anyW = vols.some(v=>v>0);
  if(logs.length>=2 && anyW){
    const w=280,h=36, max=Math.max.apply(null,vols)||1, min=Math.min.apply(null,vols);
    const pts = vols.map((v,i)=>{
      const x = logs.length>1 ? (i/(logs.length-1))*w : 0;
      const y = h - 4 - ((v-min)/((max-min)||1))*(h-8);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    html += '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--plateD)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    html += '<div class="small muted" style="margin-bottom:8px">Estimated volume (weight × reps)</div>';
  }
  logs.slice().reverse().forEach(l=>{
    const sets = l.sets.map(s=> fmtSet(s, loadType(colById(l.col)))).join("  ");
    html += '<div class="histlog"><span>'+sets+'</span><span class="hdate">'+esc(l.date)+' · '+esc(l.col)+'</span></div>';
  });
  body.innerHTML = html;
}

/* ================================================================= PLAYER (state machine) */
const Player = {
  active:false, steps:[], idx:0, colId:null, colIdx:0, mode:"session",
  startTs:0, dur:0, paused:false, pausedAt:0, pauseAccum:0, raf:0, quick:null,
  ended:false,

  buildSessionSteps(colId){
    const colIdx = COLUMNS.indexOf(colById(colId));
    const steps = [];
    for(let round=1; round<=ROUNDS; round++){
      for(let r=0;r<5;r++){
        steps.push({ type:"exercise", round, row:r, colIdx, sec:WORK_SEC });
        const lastOfRound = (r===4), lastOfAll = lastOfRound && round===ROUNDS;
        if(lastOfAll) continue;
        if(lastOfRound) steps.push({ type:"rest", sec:BREAK_SEC, label:"Halfway · breathe" });
        else            steps.push({ type:"rest", sec:REST_SEC,  label:"Rest" });
      }
    }
    steps.push({ type:"summary" });
    return steps;
  },
  // quick session: N straight sets of one move. Rep sets count up until you
  // tap Done; timed sets count down like the main session.
  buildQuickSteps(q){
    const steps = [];
    for(let set=1; set<=q.sets; set++){
      steps.push({ type:"exercise", quick:true, round:set, sec: q.timed ? q.work : 0, countUp: !q.timed });
      if(set<q.sets && q.rest>0) steps.push({ type:"rest", sec:q.rest, label:"Rest" });
    }
    steps.push({ type:"summary" });
    return steps;
  },

  startSession(colId){ this._start(colId, "session", this.buildSessionSteps(colId)); },
  startQuick(){ const q = qsConfig(); this.quick = q; this._start(q.ex.col, "quick", this.buildQuickSteps(q)); },

  _start(colId, mode, steps){
    this.active=true; this.ended=false; this.mode=mode; this.colId=colId; this.colIdx=COLUMNS.indexOf(colById(colId));
    this.steps=steps; this.idx=0;
    document.documentElement.classList.toggle("reduced", matchMedia("(prefers-reduced-motion: reduce)").matches);
    requestWake();
    try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); AC.resume&&AC.resume(); }catch(e){}
    this.renderShell();
    this.enter(0);
  },
  enter(i){
    this.idx=i;
    const step = this.steps[i];
    if(!step){ this.finish(); return; }
    if(step.type==="summary"){ this.finish(); return; }
    this.startTs = Date.now(); this.dur = step.sec; this.paused=false; this.pauseAccum=0;
    if(step.type==="rest") cueChime();
    this.renderStep();
    this.loop();
  },
  elapsed(){
    if(this.paused) return (this.pausedAt - this.startTs - this.pauseAccum)/1000;
    return (Date.now() - this.startTs - this.pauseAccum)/1000;
  },
  remaining(){ return this.dur - this.elapsed(); },
  loop(){
    cancelAnimationFrame(this.raf);
    const tick = ()=>{
      if(!this.active) return;
      const rem = this.remaining();
      this.paint(rem);
      const step = this.steps[this.idx];
      if(rem<=0 && step.type==="rest"){
        cueRestEnd(); vibrate([80,60,80]);
        this.next(true); return;
      }
      if(rem<=0 && step.type==="exercise" && !step.countUp && !step._dinged){
        step._dinged=true; beep(760,0.12,0); vibrate(60);
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },
  paint(rem){
    const ring = document.getElementById("ringProg");
    const timeEl = document.getElementById("ringTime");
    const step = this.steps[this.idx];
    const countUp = !!(step && step.countUp);
    if(timeEl) timeEl.textContent = mmss(countUp ? this.elapsed() : rem);
    if(ring){
      const C = 2*Math.PI*52;
      const frac = countUp ? 1 : Math.max(0, Math.min(1, rem/this.dur));
      ring.style.strokeDasharray = C;
      ring.style.strokeDashoffset = C*(1-frac);
    }
  },
  next(auto){
    const step=this.steps[this.idx];
    if(step && step.type==="exercise") step._dinged=false;
    this.enter(this.idx+1);
  },
  skip(){ this.enter(this.idx+1); },
  add30(){ this.dur += 30; this.paint(this.remaining()); },
  togglePause(){
    if(this.paused){
      this.pauseAccum += (Date.now() - this.pausedAt);
      this.paused=false; this.loop();
    } else {
      this.paused=true; this.pausedAt=Date.now();
      cancelAnimationFrame(this.raf);
    }
    this.renderControls();
  },
  exit(){
    confirmDialog("Exit workout?","Your progress in this session won't be saved.", ()=>{
      this.teardown();
    });
  },
  teardown(){
    this.active=false; cancelAnimationFrame(this.raf); releaseWake();
    document.getElementById("overlayRoot").innerHTML="";
  },

  renderShell(){
    const col = colById(this.colId);
    const root = document.getElementById("overlayRoot");
    root.innerHTML = "";
    const ov = el('<div class="overlay" style="--accent:'+col.color+'"></div>');
    ov.innerHTML =
      '<div class="obar"><button class="icon-btn" id="pExit" aria-label="Exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '<div class="phase" id="pPhase" style="color:'+col.color+'"></div>'+
      '<button class="icon-btn" id="pMute" aria-label="Mute"></button></div>'+
      '<div id="pStage"></div>';
    root.appendChild(ov);
    ov.querySelector("#pExit").addEventListener("click", ()=>this.exit());
    const mute = ov.querySelector("#pMute");
    const paintMute=()=>{ mute.innerHTML = S.settings.sound
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>'; };
    paintMute();
    mute.addEventListener("click", ()=>{ S.settings.sound=!S.settings.sound; save(); paintMute(); if(S.settings.sound) cueChime(); });
  },
  renderStep(){
    const step=this.steps[this.idx];
    const col = colById(this.colId);
    const phase = document.getElementById("pPhase");
    const stage = document.getElementById("pStage");
    const q = this.quick;
    let phaseLabel="";
    if(step.type==="rest") phaseLabel = step.label || "Rest";
    else if(step.type==="exercise") phaseLabel = this.mode==="quick" ? ("Set "+step.round+" of "+q.sets) : ("Round "+step.round+" of "+ROUNDS+" · "+(step.row+1)+"/5");
    phase.textContent = phaseLabel;

    let html = '<div class="ring-wrap"><div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="prog" id="ringProg" cx="60" cy="60" r="52" style="stroke:'+col.color+'"/></svg>';
    html += '<div class="center"><div class="time" id="ringTime">'+mmss(step.sec)+'</div><div class="sub">'+esc(phaseLabel)+'</div></div></div></div>';

    if(step.type==="exercise" && step.quick){
      html += '<div class="player-ex">'+pico(q.ex.row, q.ex.colIdx, "pbig");
      html += '<div class="pname">'+esc(q.ex.name)+'</div>';
      html += '<div class="pcue">'+(q.timed ? "Keep moving until the timer ends" : "Tap Done when the set is finished")+'</div>';
      html += '<div class="ptarget" style="color:'+col.color+'">'+(q.timed ? (q.work+'s work') : (q.reps+' reps'))+' · '+q.sets+' sets</div></div>';
    } else if(step.type==="exercise"){
      const ex = currentEx(step.row, step.colIdx);
      const t = computeTarget(step.row, step.colIdx);
      const wtxt = t.lt==="bw" ? "Bodyweight" : (t.weight!=null ? fmtWeight(t.weight,t.lt) : "pick a weight");
      html += '<div class="player-ex">'+pico(step.row, step.colIdx, "pbig");
      html += '<div class="pname">'+esc(ex.n)+'</div>';
      html += '<div class="pcue">'+esc(ex.c)+'</div>';
      html += '<div class="ptarget" style="color:'+col.color+'">AMRAP · '+esc(wtxt)+(t.beat!=null?' · beat '+t.beat:'')+(t.sug?' · ↑ '+esc(t.sug):'')+'</div></div>';
    } else if(step.type==="rest"){
      const nextStep = this.steps[this.idx+1];
      let up="";
      if(nextStep && nextStep.type==="exercise") up = nextStep.quick ? ("Next: set "+nextStep.round+" of "+q.sets) : ("Next: "+currentEx(nextStep.row, nextStep.colIdx).n);
      html += '<div class="player-ex"><div class="pname">'+esc(step.label||"Rest")+'</div><div class="pcue">'+esc(up)+'</div></div>';
    }

    // controls
    html += '<div class="player-ctrls" id="pCtrls"></div>';
    stage.innerHTML = html;
    this.renderControls();
    this.paint(step.sec);
  },
  renderControls(){
    const c = document.getElementById("pCtrls");
    if(!c) return;
    const step=this.steps[this.idx];
    const last = this.steps[this.idx+1] && this.steps[this.idx+1].type==="summary";
    const nextLabel = step.type==="rest" ? "Skip rest" :
                      step.quick ? (last ? "Finish" : "Done") : "Next";
    const countUp = !!step.countUp; // rep-based set: no clock to extend
    c.innerHTML =
      '<button class="btn secondary" id="cPause">'+(this.paused?"Resume":"Pause")+'</button>'+
      (countUp ? '' : '<button class="btn secondary" id="cAdd">+30s</button>')+
      '<button class="btn'+(countUp?'':' wide')+'" id="cNext" style="background:'+colById(this.colId).color+'">'+nextLabel+' ▸</button>';
    c.querySelector("#cPause").addEventListener("click", ()=>this.togglePause());
    if(!countUp) c.querySelector("#cAdd").addEventListener("click", ()=>this.add30());
    c.querySelector("#cNext").addEventListener("click", ()=>this.skip());
  },

  finish(){
    this.active=false; cancelAnimationFrame(this.raf); releaseWake();
    cueChime(); vibrate([100,50,100]);
    if(this.mode==="quick") this.finishQuick();
    else this.finishSession();
  },
  finishSession(){
    const col = colById(this.colId); const colIdx=this.colIdx;
    const root = document.getElementById("overlayRoot"); root.innerHTML="";
    const ov = el('<div class="overlay" style="--accent:'+col.color+'"></div>');
    let html = '<div class="obar"><div class="phase" style="flex:1;color:'+col.color+'">Session complete</div></div>';
    html += '<div style="text-align:center;margin:8px 0 4px"><div style="font-size:42px">✅</div><h2 style="font-size:20px;margin-top:4px">Nice work</h2><p class="muted small">Log your AMRAP sets — weight is pre-filled, enter your reps.</p></div>';
    html += '<div class="card" style="margin-bottom:14px">';
    for(let r=0;r<5;r++){
      const ex = currentEx(r, colIdx); const t = computeTarget(r, colIdx);
      html += '<div class="log-ex" data-row="'+r+'"><div class="lname">'+(r+1)+'. '+esc(ex.n)+'</div>';
      for(let s=0;s<SESSION_SETS;s++){
        const wv = t.lt==="bw" ? "" : (t.weight!=null?t.weight:"");
        html += '<div class="lset"><div class="lshead"><span class="setn">Set '+(s+1)+'</span>'+
                (t.lt==="bw" ? '<span class="small muted">bodyweight</span>'
                             : '<input type="number" inputmode="decimal" class="w" placeholder="'+S.settings.units+'" value="'+wv+'">')+
                '<span class="small muted">reps → tap</span></div>'+ repPad(null) +'</div>';
      }
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="player-ctrls"><button class="btn secondary wide" id="skipLog">Skip logging</button><button class="btn wide" id="saveLog" style="background:'+col.color+'">Save session</button></div>';
    ov.innerHTML = html; root.appendChild(ov); wireRepPads(ov);

    ov.querySelector("#saveLog").addEventListener("click", ()=>{
      const iso = todayISO(); const added=[];
      ov.querySelectorAll(".log-ex").forEach(node=>{
        const r = +node.getAttribute("data-row"); const exName = currentEx(r, colIdx).n;
        const sets = [];
        node.querySelectorAll(".lset").forEach(ls=>{
          const wi = ls.querySelector("input.w"), pad = ls.querySelector(".reppad");
          const w = (wi && wi.value!=="") ? +wi.value : 0;
          const rr = (pad && pad.dataset.val) ? +pad.dataset.val : 0;
          if(w>0 || rr>0) sets.push({ w, r:rr });
        });
        if(sets.length){ const log={ date:iso, col:this.colId, mode:"session", row:r, exercise:exName, sets }; S.logs.push(log); added.push(log); }
      });
      S.sessionsDone[iso] = this.colId;
      const prs = detectPRs(added); save(); checkAchievements(); save();
      this.teardown();
      toast(prs.length ? ("🏆 New PR: "+prs[0]) : "Session saved 💪"); switchTab("today");
    });
    ov.querySelector("#skipLog").addEventListener("click", ()=>{
      S.sessionsDone[todayISO()] = this.colId; save(); checkAchievements(); save();
      this.teardown(); toast("Marked complete"); switchTab("today");
    });
  },
  finishQuick(){
    const q = this.quick; const col = colById(q.ex.col);
    const root = document.getElementById("overlayRoot"); root.innerHTML="";
    const ov = el('<div class="overlay" style="--accent:'+col.color+'"></div>');
    let html = '<div class="obar"><div class="phase" style="flex:1;color:'+col.color+'">Quick session done</div></div>';
    html += '<div style="text-align:center;margin:8px 0 4px"><div style="font-size:40px">⚡</div><h2 style="font-size:18px;margin-top:4px">'+esc(q.ex.name)+'</h2><p class="muted small">'+esc(qsSummary(q))+'. Adjust anything you missed, then save.</p></div>';
    html += '<div class="card" style="margin-bottom:14px"><div class="log-ex" style="border:0">';
    for(let s=0;s<q.sets;s++){
      html += '<div class="lset"><div class="lshead"><span class="setn">Set '+(s+1)+'</span>'+
              (q.ex.lt==="bw" ? '<span class="small muted">bodyweight</span>'
                              : '<input type="number" inputmode="decimal" class="w" placeholder="'+S.settings.units+'">')+
              '<span class="small muted">'+(q.timed ? (q.work+'s · reps optional') : 'reps → tap')+'</span></div>'+ repPad(q.timed ? null : q.reps) +'</div>';
    }
    html += '</div></div>';
    html += '<div class="player-ctrls"><button class="btn secondary wide" id="skipLog">Discard</button><button class="btn wide" id="saveLog" style="background:'+col.color+'">Save quick session</button></div>';
    ov.innerHTML = html; root.appendChild(ov); wireRepPads(ov);

    ov.querySelector("#saveLog").addEventListener("click", ()=>{
      const iso=todayISO(); const sets=[];
      ov.querySelectorAll(".lset").forEach(ls=>{
        const wi=ls.querySelector("input.w"), pad=ls.querySelector(".reppad");
        const w=(wi&&wi.value!=="")?+wi.value:0;
        const rr=(pad&&pad.dataset.val)?+pad.dataset.val:0;
        const set = { w, r:rr }; if(q.timed) set.sec = q.work;
        if(w>0||rr>0||q.timed) sets.push(set);
      });
      if(!sets.length){ toast("Tap the reps for at least one set"); return; }
      const log={ date:iso, col:q.ex.col, mode:"quick", exercise:q.ex.name, sets };
      S.logs.push(log);
      const prs=detectPRs([log]); save(); checkAchievements(); save(); this.teardown();
      const n = quickCount(iso);
      toast(prs.length ? ("🏆 New PR: "+q.ex.name) : (n>=3 ? "Quick session "+n+" — day complete! 🔥" : ("Quick session "+n+" saved ⚡")));
      switchTab("quick");
    });
    ov.querySelector("#skipLog").addEventListener("click", ()=>{ this.teardown(); switchTab("quick"); });
  }
};

/* ================================================================= INIT */
function init(){
  load();
  applyTheme();
  checkAchievements(true); save(); // record already-earned badges silently
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click", ()=> switchTab(b.getAttribute("data-tab")));
  });
  document.getElementById("gearBtn").addEventListener("click", ()=> switchTab("settings"));
  document.getElementById("fabQuick").addEventListener("click", openQuickLog);
  switchTab("today");

  // re-render Today if the day changed while the app stayed open
  let lastDay = todayISO();
  setInterval(()=>{
    const now = todayISO();
    if(now!==lastDay){ lastDay=now; if(!Player.active){ switchTab("today"); } }
  }, 60000);

  // service worker: only when hosted over https
  if(location.protocol==="https:" && "serviceWorker" in navigator){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
}
init();
})();
</script>
</body>
</html>
