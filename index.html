<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171A1F">
<meta name="description" content="Home Strength Blueprint — an 11-minute daily strength workout you can do with bodyweight, bands, or dumbbells.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Strength Blueprint</title>
<style>
/* ================================================================= TOKENS */
:root{
  --paper:#F4F3EF; --card:#FFFFFF; --ink:#171A1F; --muted:#5E6167;
  --hair:#C9C8C2; --accent:#5C6470;
  --plateA:#C0392B; --plateB:#1F4E9C; --plateC:#D9A413; --plateD:#2E7D4B; --plateE:#5C6470;
  --radius:12px; --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --head:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#15171B; --card:#1E2127; --ink:#F0F0EC; --muted:#9A9DA4; --hair:#33373E; }
}
:root[data-theme="dark"]{ --paper:#15171B; --card:#1E2127; --ink:#F0F0EC; --muted:#9A9DA4; --hair:#33373E; }
:root[data-theme="light"]{ --paper:#F4F3EF; --card:#FFFFFF; --ink:#171A1F; --muted:#5E6167; --hair:#C9C8C2; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.33;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:.01em}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 0 calc(60px + var(--safe-b))}

/* ================================================================= HEADER */
header.top{
  position:sticky;top:0;z-index:20;background:var(--paper);
  display:flex;align-items:center;gap:8px;
  padding:8px 12px 7px;border-bottom:1px solid var(--hair);
}
header.top .title{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;flex:1}
header.top .title small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
.icon-btn{
  width:40px;height:40px;min-width:40px;
  border:1px solid var(--hair);border-radius:10px;background:var(--card);
  display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:20px;height:20px}

/* ================================================================= BANDS / CHIPS */
.band{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--paper);
  padding:5px 11px;border-radius:999px;
  font-family:var(--head);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.25;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
  background:var(--card);border:1px solid var(--hair);color:var(--muted);
}
.chip.solid{background:var(--accent);color:#fff;border-color:transparent}

/* ================================================================= CARDS */
main{padding:12px}
.card{
  background:var(--card);border:1px solid var(--hair);border-radius:var(--radius);
  padding:11px 12px;box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.card + .card{margin-top:10px}
.section-h{
  font-family:var(--head);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--paper);background:var(--ink);border-radius:999px;
  padding:4px 10px;display:inline-block;margin:13px 0 7px;
}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* ================================================================= EXERCISE ROW */
.ex{
  display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);
}
.ex:last-child{border-bottom:0}
.ex .badge{
  width:24px;height:24px;min-width:24px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--head);font-weight:900;font-size:13px;color:#fff;
}
.ex .pico{width:54px;height:38px;min-width:54px}
.ex .exbody{flex:1;min-width:0}
.ex .exname{font-weight:700;font-size:14px}
.ex .excue{font-size:11.5px;color:var(--muted);margin-top:0}
.ex .extarget{font-size:12px;margin-top:2px}
.ex .extarget b{color:var(--ink)}
.ex .sug{color:var(--plateD);font-weight:700}
.extag{display:inline-block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;vertical-align:1px;margin-left:2px}
.pickrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--hair);cursor:pointer;border-radius:8px}
.pickrow:last-child{border-bottom:0}
.pickrow.on{background:var(--paper)}
.pickrow .pickn{width:22px;height:22px;min-width:22px;border-radius:6px;background:var(--hair);color:var(--ink);font-family:var(--head);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center}
.pickrow.on .pickn{background:var(--accent);color:#fff}
.pickrow .tck{font-weight:900;color:var(--accent);min-width:14px}
.pswitch{margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
.pswitch.now{color:var(--accent);font-size:16px}

.pico svg{width:100%;height:100%;display:block}

/* ================================================================= BUTTONS */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:var(--tap);padding:10px 14px;border-radius:10px;
  border:1px solid transparent;font-weight:800;font-size:14px;
  font-family:var(--head);letter-spacing:.03em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);
}
.btn.secondary{background:var(--card);color:var(--ink);border-color:var(--hair)}
.btn.accent{background:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--muted);text-transform:none;letter-spacing:0;font-weight:700}
.btn.danger{background:var(--plateA)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{margin-top:0}
.btn:active{transform:translateY(1px)}

/* streak */
.streak{display:flex;align-items:center;gap:6px;font-weight:800;font-family:var(--head)}
.streak .flame{font-size:17px}

/* ================================================================= TAB BAR */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--card);border-top:1px solid var(--hair);
  display:flex;padding-bottom:var(--safe-b);
  max-width:720px;margin:0 auto;
}
nav.tabs button{
  flex:1;background:none;border:0;padding:6px 0 5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;min-height:50px;
}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button.active{color:var(--ink)}
nav.tabs button.active svg{stroke:var(--ink)}

section[hidden]{display:none}

/* ================================================================= PLAYER OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:50;background:var(--paper);
  display:flex;flex-direction:column;padding:0 20px calc(20px + var(--safe-b));
  overflow:auto;
}
.overlay .obar{display:flex;align-items:center;gap:12px;padding:16px 0 4px}
.overlay .obar .phase{flex:1;font-family:var(--head);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:14px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0}
.ring{position:relative;width:min(74vw,300px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--hair);stroke-width:8}
.ring .prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.reduced .ring .prog{transition:none}
.ring .center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
.ring .time{font-family:var(--head);font-weight:900;font-size:56px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .sub{font-size:13px;color:var(--muted);margin-top:6px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.player-ex{text-align:center;margin-top:6px}
.player-ex .pbig{width:150px;height:105px;margin:0 auto}
.player-ex .pname{font-family:var(--head);font-weight:800;font-size:22px;margin-top:6px}
.player-ex .pcue{color:var(--muted);font-size:14px;margin-top:4px;max-width:340px;margin-left:auto;margin-right:auto}
.player-ex .ptarget{margin-top:8px;font-weight:800;font-family:var(--head);letter-spacing:.03em}
.player-list{margin:10px auto;max-width:360px;text-align:left}
.player-list li{padding:6px 0;border-bottom:1px solid var(--hair);font-size:15px}
.player-ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto;padding-top:16px}
.player-ctrls .btn{margin-top:0}
.player-ctrls .wide{grid-column:1 / -1}

/* dialog */
.modal-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--card);border-radius:var(--radius);padding:22px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--muted);margin:0 0 16px}

/* quick-log sheet */
.log-ex{display:grid;grid-template-columns:1fr;gap:5px;padding:8px 0;border-bottom:1px solid var(--hair)}
.log-ex .lname{font-weight:700;font-size:14px}
.log-ex .sets{display:flex;gap:6px;flex-wrap:wrap}
.log-ex .setin{display:flex;flex-direction:column;gap:2px}
.log-ex .setin label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.log-ex input{
  width:64px;text-align:center;padding:8px 5px;border:1px solid var(--hair);border-radius:9px;
  background:var(--paper);color:var(--ink);
}
.lset{margin-top:8px}
.lset .lshead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lset .setn{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:38px}
.reppad{display:flex;gap:5px;overflow-x:auto;padding:2px 1px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.reppad button{
  flex:0 0 auto;min-width:36px;height:36px;border-radius:9px;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;
}
.reppad button.on{background:var(--accent);color:#fff;border-color:transparent}
.reppad .repcap{font-size:11px;color:var(--muted);align-self:center;padding:0 4px;font-weight:700}

/* ================================================================= QUICK SESSION */
.qsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.qsgrid .field{margin-bottom:8px}
.lrow .pico{width:52px;height:37px;min-width:52px}

/* ================================================================= PROGRESS */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat .hd{aspect-ratio:1;border-radius:4px;background:var(--hair);cursor:pointer}
.heat .hd.rest{background:transparent;border:1px dashed var(--hair)}
.heat .hd.partial{background:#9ec9ad}
.heat .hd.full{background:var(--plateD)}
.heat .hd.future{background:transparent}
.heatlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.heatlabels span{text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.spark{width:100%;height:36px;display:block;margin-top:6px}
.histlog{padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px;display:flex;justify-content:space-between;gap:10px}
.histlog .hdate{color:var(--muted);font-size:11.5px}

/* settings */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-weight:700;font-size:13px}
.field input,.field select,.field textarea{
  padding:9px 10px;border:1px solid var(--hair);border-radius:9px;background:var(--paper);color:var(--ink);width:100%;
}
.field textarea{min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--hair)}
.switch{position:relative;width:52px;height:30px}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--hair);border-radius:999px;transition:.2s}
.switch .sl:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .sl{background:var(--plateD)}
.switch input:checked + .sl:before{transform:translateX(22px)}
.seg{display:flex;border:1px solid var(--hair);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px;background:var(--paper);border:0;font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:9px 11px}
.kpi b{display:block;font-family:var(--head);font-size:21px;font-weight:900;letter-spacing:-.01em;line-height:1}
.kpi span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
/* achievements */
.achs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.ach{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;opacity:.32;filter:grayscale(1)}
.ach.on{opacity:1;filter:none}
.ach .aic{font-size:20px;line-height:1}
.ach .alab{font-size:8.5px;color:var(--muted);font-weight:700;line-height:1.1}
/* compact list rows */
.lrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .lr-main{flex:1;min-width:0}
.lrow .lr-name{font-weight:700}
.lrow .lr-sub{font-size:11.5px;color:var(--muted)}
.lrow .lr-val{font-family:var(--head);font-weight:800;text-align:right}
.lrow .lr-val small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
/* mini goal ring */
/* workout-type picker */
.typopt{
  display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:7px;
  border:1.5px solid var(--hair);border-radius:12px;background:var(--card);cursor:pointer;
}
.typopt.on{border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.typopt .tl{
  width:34px;height:34px;min-width:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--head);font-weight:900;font-size:13px;letter-spacing:.02em;color:#fff;
}
.typopt.on .tl{background:rgba(255,255,255,.22)!important}
.typopt .tmeta{flex:1;min-width:0}
.typopt .tnm{font-weight:800;font-size:14px;line-height:1.15}
.typopt .tsub{font-size:11.5px;color:var(--muted);margin-top:1px}
.typopt.on .tsub{color:rgba(255,255,255,.9)}
.typopt .tck{font-weight:900;font-size:16px;opacity:0}
.typopt.on .tck{opacity:1}
/* swap chips */
.swap{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.swap button{
  flex:1;min-width:44px;padding:8px 0;border-radius:9px;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);font-family:var(--head);font-weight:900;font-size:15px;
}
.swap button.on{color:#fff;border-color:transparent}
.inline-note{font-size:11.5px;color:var(--muted);margin-top:6px}
/* swap button on each move + moves left out */
.swapbtn{
  flex:none;padding:6px 10px;border-radius:999px;border:1px solid var(--hair);
  background:var(--paper);color:var(--ink);font-weight:800;font-size:12px;min-height:32px;
}
.ex .edbtns{display:flex;gap:4px;flex:none}
.ex .edbtns button{width:34px;height:34px;border-radius:9px;border:1px solid var(--hair);background:var(--paper);font-weight:900;font-size:14px;padding:0}
.ex .edbtns button:disabled{opacity:.3}
.ex .edbtns .del{color:var(--plateA)}
.addmove{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1.5px dashed var(--hair);background:transparent;color:var(--ink);font-weight:800;font-size:13px}
/* move picker sheet */
.picker-back{align-items:flex-end;padding:0}
.picker{max-width:560px;width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;padding:14px 14px calc(10px + var(--safe-b))}
.picker .pk-top{flex:none}
.picker .pk-list{flex:1;overflow-y:auto;margin:6px -4px 0;padding:0 4px;-webkit-overflow-scrolling:touch}
.picker .pk-search{width:100%;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);color:var(--ink);font-size:16px}
.pk-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.pk-chips::-webkit-scrollbar{display:none}
.pk-chips button{flex:none;padding:6px 11px;border-radius:999px;border:1.5px solid var(--hair);background:var(--paper);color:var(--ink);font-weight:700;font-size:12.5px;white-space:nowrap}
.pk-chips button.on{background:var(--ink);color:var(--paper);border-color:transparent}
.pk-h{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin:12px 2px 4px}
.pkrow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;cursor:pointer;border:1.5px solid transparent}
.pkrow.on{border-color:var(--accent);background:var(--paper)}
.pkrow .pico{width:52px;height:37px;min-width:52px}
.pkrow .lr-main{flex:1;min-width:0}
.pkrow .eqtag{flex:none;font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:2px 6px}
.pkrow .tck{flex:none;font-weight:900;color:var(--accent);min-width:14px;text-align:center}
.pk-empty{padding:18px 6px;text-align:center;color:var(--muted);font-size:13px}
/* timing: work / rest / rounds steppers */
.steppers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stepper{background:var(--paper);border:1px solid var(--hair);border-radius:10px;padding:7px 2px 6px;text-align:center}
.stepper .slab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.stepper .sval{font-family:var(--head);font-weight:900;font-size:24px;line-height:1.1;margin:2px 0 5px;white-space:nowrap}
.stepper .sval small{font-size:13px;font-weight:700;color:var(--muted);margin-left:1px}
.stepper .sctl{display:flex;gap:5px;padding:0 4px}
.stepper button{
  flex:1;min-width:0;height:38px;border-radius:9px;border:1px solid var(--hair);
  background:var(--card);font-weight:900;font-size:19px;line-height:1;padding:0;
}
.stepper button:disabled{opacity:.35}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.presets button{padding:6px 10px;border-radius:999px;border:1px solid var(--hair);background:var(--card);font-weight:700;font-size:12.5px;min-height:32px}
.presets button.on{background:var(--ink);color:var(--paper);border-color:transparent}
/* day detail rows in modal */
.dd-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--hair);font-size:13px}
.dd-row:last-child{border-bottom:0}
/* floating quick-log button */
.fab{
  position:fixed;z-index:35;bottom:calc(62px + var(--safe-b));
  right:max(16px, calc(50vw - 360px + 16px));
  width:52px;height:52px;border-radius:50%;border:0;
  background:var(--ink);color:var(--paper);box-shadow:0 4px 14px rgba(0,0,0,.32);
  display:flex;align-items:center;justify-content:center;
}
.fab svg{width:26px;height:26px}
.fab:active{transform:translateY(1px)}
/* quick-log picker */
.qchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.qchip{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;border:1.5px solid var(--hair);background:var(--paper);color:var(--ink);font-weight:700;font-size:13px}
.qchip.on{background:var(--ink);color:var(--paper);border-color:transparent}

function customMoves(){ return Array.isArray(S.settings.custom) ? S.settings.custom : (S.settings.custom=[]); }
// resolve a plan entry to a full move, or null if it no longer exists
function resolveEntry(e){
  if(!e) return null;

    const cm = customMoves().find(x=>x.n===e.n); if(!cm) return null;
    const ci = Math.max(0, COLUMNS.findIndex(c=>c.id===cm.eq));

  if(colIdx<0 || !lad) return null;
  const li = lad.findIndex(o=>o.n===e.n); if(li<0) return null;
  const o = lad[li];

    const lad = ladder(kitId, r);
    out.push({ k:kitId, r, n:(typeof v==="string" && lad.some(o=>o.n===v)) ? v : ladderDefault(kitId, r) });

}

}

function savePlan(kitId, entries){ if(!S.settings.plans) S.settings.plans={}; S.settings.plans[kitId]=entries.slice(0, MAX_MOVES); save(); }
function entryOf(k, r, n){ return k==="X" ? { k:"X", n } : { k, r, n }; }
function sameEntry(a, b){ return a.k===b.k && a.n===b.n && (a.k==="X" || a.r===b.r); }
// the next rung up the ladder, or null at the top / for your own moves
function nextRung(ex){ return (ex.lad && ex.li+1<ex.lad.length) ? ex.lad[ex.li+1] : null; }
// reroll every move to a different one on the same ladder (your own moves stay)
function shuffleKit(kitId){
  savePlan(kitId, planEntries(kitId).map(e=>{
    const lad = e.k==="X" ? null : ladder(e.k, e.r);
    if(!lad || lad.length<2) return e;
    let o; do { o = lad[Math.floor(Math.random()*lad.length)]; } while(o.n===e.n);
    return { k:e.k, r:e.r, n:o.n };
  }));
}
// one-tap workout types: a list of categories, filled from the kit's ladders
// (default move first, then its neighbours; other kits only if a kit runs out)
const FOCUS = [
  { id:"full",   name:"Full body",        cats:[0,1,2,3,4] },
  { id:"upper",  name:"Upper body",       cats:[2,3,6,5,4] },
  { id:"lower",  name:"Lower body",       cats:[0,1,7,0,1] },
  { id:"arms",   name:"Arms & shoulders", cats:[5,6,5,6,2] },
  { id:"core",   name:"Core",             cats:[4,4,4,4,4] },
  { id:"cardio", name:"Cardio",           cats:[8,8,8,8,8] },
];
function ladderOrder(lad){
  const d = Math.max(0, lad.findIndex(o=>o.d)), out = [d];
  for(let k=1; out.length<lad.length; k++){ if(d+k<lad.length) out.push(d+k); if(d-k>=0) out.push(d-k); }
  return out.map(i=>lad[i]);
}
function buildFocus(kitId, fc){
  const used = new Set(), out = [];
  const kits = [kitId].concat(COLUMNS.map(c=>c.id).filter(k=>k!==kitId));
  fc.cats.forEach(r=>{
    for(const k of kits){
      const o = ladderOrder(ladder(k, r)).find(x=> !used.has(x.n));
      if(o){ used.add(o.n); out.push({ k, r, n:o.n }); return; }
    }
  });
  return out;
}
function focusMatch(kitId){
  const cur = planEntries(kitId);
  const f = FOCUS.find(fc=>{ const b=buildFocus(kitId, fc); return b.length===cur.length && b.every((e,i)=> sameEntry(e, cur[i])); });
  return f ? f.id : null;
}

/* ================================================================= STORE */
const KEY = "hsb.v1";
function defaultState(){
  return {
    settings:{ units:"kg", pickedCol:"BW", sound:true, vibrate:true,
               theme:"system", exPick:{}, exSkip:{}, plans:{}, custom:[], schema:2,
               work:45, rest:15, rounds:2,
               quick:{ ex:null, sets:5, reps:5, rest:30, timed:false, work:45 } },
    logs:[], snacksDone:{}, sessionsDone:{}, bodyweight:[], achievements:[]
  };
}
// v1 stored five lettered kits (A Dumbbells, B Bands, C/D No Equipment, E Full
// Kit). Map them onto the three kits so old logs keep their load type.
const V1_COL = { A:"DB", B:"BD", C:"BW", D:"BW", E:"DB" };
function migrateCol(c){ return colById(c) ? c : (V1_COL[c] || "BW"); }
let S = defaultState();
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
  if(!raw){ S = defaultState(); save(); return; }
  try {
    const parsed = JSON.parse(raw);
    S = migrate(parsed);
  } catch(e){
    try { localStorage.setItem(KEY+".corrupt", raw); } catch(_){}
    S = defaultState(); save();
  }
}
function migrate(obj){
  const d = defaultState();
  if(!obj || typeof obj !== "object") return d;
  const s = Object.assign({}, d.settings, obj.settings || {});
  s.quick = Object.assign({}, d.settings.quick, (obj.settings && obj.settings.quick) || {});
  if(s.quick.ex && !colById(s.quick.ex.col)) s.quick.ex = null;
  const logs = Array.isArray(obj.logs) ? obj.logs : [];
  const sessionsDone = (obj.sessionsDone && typeof obj.sessionsDone==="object") ? obj.sessionsDone : {};
  if(!(obj.settings && obj.settings.schema >= 2)){
    s.pickedCol = migrateCol(s.pickedCol);
    logs.forEach(l=>{ l.col = migrateCol(l.col); });
    Object.keys(sessionsDone).forEach(k=>{ sessionsDone[k] = migrateCol(sessionsDone[k]); });
    s.exPick = {}; // v1 swaps indexed a different library; start from the defaults
    delete s.interval; delete s.weeklyGoal;
    s.schema = 2;
  }
  return {
    settings:s,
    logs,
    snacksDone: (obj.snacksDone && typeof obj.snacksDone==="object") ? obj.snacksDone : {}, // legacy v1 days, kept for the heatmap
    sessionsDone,
    bodyweight: Array.isArray(obj.bodyweight) ? obj.bodyweight : [],
    achievements: Array.isArray(obj.achievements) ? obj.achievements : [],
  };
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ /* quota / private mode */ }
}

/* ================================================================= CLOCK */
function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function parseISO(s){ const p=(s||"").split("-"); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); }
function addDays(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function colById(id){ return COLUMNS.find(c=>c.id===id); }

/* ================================================================= PROGRESSION */
function loadType(col){
  if(!col) return "bw";
  if(/dumbbell/.test(col.equipment)) return "db";
  if(/band/.test(col.equipment)) return "band";
  return "bw";
}
function lastLogFor(exName){
  for(let i=S.logs.length-1;i>=0;i--){ if(S.logs[i].exercise===exName) return S.logs[i]; }
  return null;
}
// one logged set as text: "12kg×8", "BW×15", or "45s" for a timed set
function fmtSet(s, lt){
  const w = +s.w||0, r = +s.r||0;
  if(!r && s.sec) return (+s.sec)+"s";
  return (w ? fmtWeight(w,lt) : "BW") + "×" + r;
}
function fmtWeight(w, lt){
  if(lt==="bw") return "BW";
  if(w===null || w===undefined || w==="") return "—";
  if(lt==="band") return "L"+w;              // band level
  return w + S.settings.units;
}
// AMRAP model: no prescribed reps. Each working set is "as many good reps as
// you can in 45s". The kit's rep ceiling is the only number: once you clear it,
// you're told to add load (double progression) — never an exact count to hit.
// one working set per move per round
// the number a set is judged on: reps, or seconds for a hold
function setMetric(s, hold){ return hold ? (+s.sec||0) : (+s.r||0); }
function computeTarget(ex){
  const col = COLUMNS[ex.colIdx];
  const exName = ex.n, hold = !!ex.hold;
  const high = hold ? workSec() : col.ceiling; // a hold is cleared when you hold the whole interval
  const lt = loadType(col);
  const inc = S.settings.units==="kg" ? 2.5 : 5;
  const last = lastLogFor(exName);
  const rung = nextRung(ex);
  let weight = null, sug = "", beat = null;

  if(last && last.sets && last.sets.length){
    const vals  = last.sets.map(s=> setMetric(s, hold));
    const ws    = last.sets.map(s=> +s.w || 0);
    const lastW = Math.max.apply(null, ws.concat([0]));
    const best  = Math.max.apply(null, vals);
    weight = (lt==="bw") ? null : (lastW>0 ? lastW : null);
    const cleared = best >= high; // beat the ceiling last time
    if(cleared){
      if(lt==="db" && !hold){ weight = (weight||0)+inc; sug = "add "+inc+S.settings.units; }
      else if(lt==="db"){ weight = (weight||0)+inc; sug = "add "+inc+S.settings.units+(rung?" or next: "+rung.n:""); }
      else if(lt==="band"){ sug = rung ? "next: "+rung.n : "thicker band"; }
      else { sug = rung ? "next: "+rung.n : (ex.lad ? "top of the ladder — add a rep" : "add a rep or slow it down"); }
    } else {
      beat = best; // otherwise just beat your best set
    }
  }
  return { col, exName, hold, lt, last, high, weight, sug, beat, rung, sets:roundsN() };
}
function targetLineHTML(t){
  const w = fmtWeight(t.weight, t.lt);
  const mode = t.hold ? "Hold" : "AMRAP";
  const today = (t.lt==="bw") ? mode : (mode+" @ " + (t.weight!=null ? w : "pick a weight"));
  let html;
  if(t.last && t.last.sets && t.last.sets.length){
    const lw = fmtWeight(Math.max.apply(null, t.last.sets.map(s=>+s.w||0).concat([0])) || null, t.lt);
    const vals = t.last.sets.map(s=> setMetric(s, t.hold)+(t.hold?"s":"")).join(",");
    html = "Last: <b>"+lw+" × "+vals+"</b> → <b>"+today+"</b>";
  } else {
    html = "<b>"+today+"</b>";
  }
  if(t.sug) html += ' <span class="sug">↑ '+esc(t.sug)+'</span>';
  else if(t.beat!=null) html += ' <span class="sug">beat '+t.beat+(t.hold?"s":"")+'</span>';
  return html;
}

/* ================================================================= STREAK & COMPLETION */
function allSnacks(iso){ const a=S.snacksDone[iso]; return a && a.length>=5; } // legacy v1 snack days
function quickCount(iso){ let n=0; for(const l of S.logs) if(l.date===iso && l.mode==="quick") n++; return n; }
// "activity" = quick sessions + ad-hoc quick logs done that day (+ legacy snack ticks)
function activityCount(iso){ return (S.snacksDone[iso]?S.snacksDone[iso].length:0) + quickCount(iso); }
function dayComplete(iso){ return !!S.sessionsDone[iso] || activityCount(iso)>=3; }
function dayLevel(iso){ // 0 nothing, 1 some activity, 2 full
  if(S.sessionsDone[iso] || allSnacks(iso) || activityCount(iso)>=3) return 2;
  if(activityCount(iso)>0) return 1;
  return 0;
}
function currentStreak(){
  let n=0, d=new Date();
  if(!dayComplete(todayISO())) d = addDays(d,-1);
  while(dayComplete(isoOf(d))){ n++; d = addDays(d,-1); }
  return n;
}
function longestStreak(){
  const keys = {};
  Object.keys(S.sessionsDone).forEach(k=> keys[k]=1);
  Object.keys(S.snacksDone).forEach(k=> keys[k]=1);
  S.logs.forEach(l=>{ if(l.mode==="quick") keys[l.date]=1; });
  const days = Object.keys(keys).filter(dayComplete);
  const set = {}; days.forEach(k=> set[k]=1);
  let best=0;
  days.forEach(k=>{
    if(set[isoOf(addDays(parseISO(k),-1))]) return; // not a run start
    let n=0, d=parseISO(k);
    while(set[isoOf(d)]){ n++; d=addDays(d,1); }
    if(n>best) best=n;
  });
  return best;
}

/* ================================================================= STATS / PRs / EFFECTIVE COLUMN */
function totalSessions(){ return Object.keys(S.sessionsDone).length; }
function weekStart(d){ const dow=(d.getDay()+6)%7; return addDays(d,-dow); } // Monday
function inThisWeek(iso){
  const d=parseISO(iso), m=weekStart(new Date());
  return stripTime(d) >= stripTime(m) && stripTime(d) <= stripTime(addDays(m,6));
}
function sessionsThisWeek(){ return Object.keys(S.sessionsDone).filter(inThisWeek).length; }
function volumeThisWeek(){
  return S.logs.filter(l=>inThisWeek(l.date))
    .reduce((a,l)=> a + l.sets.reduce((b,s)=> b+(+s.w||0)*(+s.r||0),0), 0);
}
function est1RM(w,r){ return (w>0&&r>0) ? w*(1+r/30) : 0; }
// best set (by est 1RM) for an exercise across logs, optionally excluding the last N
function bestSet(exName, logsArr){
  const arr = logsArr || S.logs;
  let best=null;
  arr.forEach(l=>{ if(l.exercise!==exName) return;
    l.sets.forEach(s=>{ const e=est1RM(+s.w||0,+s.r||0);
      if(e>0 && (!best || e>best.e)) best={ w:+s.w, r:+s.r, e, date:l.date, lt:loadType(colById(l.col)) };
    });
  });
  return best;
}

  ACHIEVEMENTS.forEach(a=>{
    if(S.achievements.indexOf(a.id)<0 && a.test()){
      S.achievements.push(a.id);
      if(!silent) toast(a.icon+" Badge: "+a.name);
    }
  });
}
// detect new personal records among a freshly-added batch of logs
function detectPRs(newLogs){
  const prior = S.logs.slice(0, S.logs.length - newLogs.length);
  const hits = [];
  newLogs.forEach(l=>{
    const before = bestSet(l.exercise, prior);
    l.sets.forEach(s=>{
      const e = est1RM(+s.w||0,+s.r||0);
      if(e>0 && (!before || e>before.e+0.01) && hits.indexOf(l.exercise)<0) hits.push(l.exercise);
    });
  });
  return hits;
}

/* ================================================================= AUDIO */
let AC = null;
function beep(freq, dur, when){
  if(!S.settings.sound) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    const t = AC.currentTime + (when||0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type="sine"; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.15));
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t+(dur||0.15)+0.02);
  }catch(e){}
}
function cueChime(){ beep(660,0.12,0); beep(880,0.14,0.13); }
function cueRestEnd(){ beep(520,0.1,0); beep(700,0.1,0.12); beep(920,0.16,0.24); }

// draw a pose for a kit: pic 0 dumbbells, 1 band, 2 bodyweight
function poseSVG(id, color, pic, cls){
  const P = POSES[id] || POSES.stand;
  const pt = a=> a[0]+" "+a[1];
  const limb = (from, j, light)=> '<path class="fig'+(light?' far':'')+'" d="M'+pt(from)+' L'+pt(j[0])+' L'+pt(j[1])+'"/>';
  let g = '<line class="gnd" x1="8" y1="64" x2="92" y2="64"/>';
  if(P.bar) g += '<line class="gnd" x1="28" y1="'+P.bar+'" x2="72" y2="'+P.bar+'"/>';
  if(P.wall) g += '<line class="gnd" x1="'+P.wall+'" y1="6" x2="'+P.wall+'" y2="64"/>';
  g += limb(P.s, P.a2, 1) + limb(P.p, P.l2, 1);
  g += '<path class="fig" d="M'+pt(P.s)+' L'+pt(P.p)+'"/>';
  g += limb(P.p, P.l1) + limb(P.s, P.a1);
  g += '<circle cx="'+P.h[0]+'" cy="'+P.h[1]+'" r="6" fill="currentColor"/>';
  // equipment
  const eq = P.eq || "hands";
  const db = (x,y)=> '<line class="eq" x1="'+(x-5)+'" y1="'+y+'" x2="'+(x+5)+'" y2="'+y+'"/><circle class="eqf" cx="'+(x-5)+'" cy="'+y+'" r="3.4"/><circle class="eqf" cx="'+(x+5)+'" cy="'+y+'" r="3.4"/>';
  const h1 = P.a1[1], h2 = P.a2[1], f1 = P.l1[1], f2 = P.l2[1];
  if(pic===0 && eq!=="none" && eq!=="knees"){
    if(eq==="hips") g += db(P.p[0], P.p[1]-5);
    else if(eq==="chest") g += db((h1[0]+h2[0])/2, (h1[1]+h2[1])/2);
    else { g += db(h1[0], h1[1]); if(eq!=="one") g += db(h2[0], h2[1]); }
  }
  if(pic===1 && eq!=="none"){
    if(eq==="knees"){
      const k1=P.l1[0], k2=P.l2[0];
      g += '<path class="eq band" d="M'+pt(k1)+' Q'+((k1[0]+k2[0])/2)+' '+(Math.max(k1[1],k2[1])+4)+' '+pt(k2)+'"/>';
    } else if(eq==="hips"){
      g += '<path class="eq band" d="M'+(P.p[0]-8)+' 63 Q'+P.p[0]+' '+(P.p[1]-12)+' '+(P.p[0]+8)+' 63"/>';
    } else {
      // band from the foot nearest the floor up to the hand(s)
      const foot = (f1[1]>=f2[1]) ? f1 : f2;
      const hands = eq==="one" ? [h1] : (eq==="chest" ? [[(h1[0]+h2[0])/2,(h1[1]+h2[1])/2]] : [h1, h2]);
      hands.forEach(h=>{ const cx=(foot[0]+h[0])/2+6, cy=(foot[1]+h[1])/2; g += '<path class="eq band" d="M'+pt(foot)+' Q'+cx+' '+cy+' '+pt(h)+'"/>'; });
    }
  }
  if(P.mo) g += '<path class="mo" d="'+P.mo+'"/>';
  return '<svg class="'+(cls||"pico")+'" viewBox="0 0 100 70" style="--accent:'+color+';color:var(--ink)" aria-hidden="true">'+g+'</svg>';
}

  if(mine.length){ opts += '<optgroup label="★ Your moves">'; mine.forEach((cm,i)=> opts += '<option value="x'+i+'">'+esc(cm.n)+'</option>'); opts += '</optgroup>'; }
  CATS.forEach((rn,r)=>{ opts += '<optgroup label="'+esc(rn)+'">';
    COLUMNS.forEach((col,c)=> ladder(col.id, r).forEach((o,oi)=> opts += '<option value="l'+r+'-'+c+'-'+oi+'">'+esc(o.n)+' — '+esc(col.name)+'</option>'));
    opts += '</optgroup>';
  });
  return opts;
}
function pickFromLibraryValue(v){
  if(v[0]==="x"){
    const cm = customMoves()[+v.slice(1)], c = Math.max(0, COLUMNS.findIndex(x=>x.id===cm.eq));
    return { name:cm.n, col:COLUMNS[c].id, lt:loadType(COLUMNS[c]), row:CATPIC[+cm.cat||0], cat:+cm.cat||0, colIdx:c, hold:!!cm.hold, sides:!!cm.sides };
  }
  const m=v.slice(1).split("-"); const r=+m[0],c=+m[1],oi=+m[2]; const o=ladder(COLUMNS[c].id, r)[oi];
  return { name:o.n, col:COLUMNS[c].id, lt:loadType(COLUMNS[c]), row:CATPIC[r], cat:r, colIdx:c, hold:!!o.hold, sides:!!o.sides };
}
function pickFromQuick(i){ const q=QUICK[i]; return { name:q.n, col:COLUMNS[q.pc].id, lt:"bw", row:q.pr, colIdx:q.pc }; }
function lockScroll(on){ document.body.style.overflow = on ? "hidden" : ""; }
function mmss(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+pad2(sec%60); }
// tap-to-pick reps: buttons 1..30 (single click), highlight in accent colour
function repPad(preset){
  let h = '<div class="reppad" data-val="'+(preset!=null?preset:"")+'">';
  for(let n=1;n<=30;n++) h += '<button type="button" data-n="'+n+'"'+((preset!=null&&+preset===n)?' class="on"':'')+'>'+n+'</button>';
  h += '<button type="button" data-n="35" class="'+((preset!=null&&+preset>30)?"on":"")+'">30+</button></div>';

// tap-to-pick seconds for a hold: 5..120 in 5s steps
function secPad(preset){
  let h = '<div class="reppad" data-val="'+(preset!=null?preset:"")+'">';
  for(let n=5;n<=120;n+=5) h += '<button type="button" data-n="'+n+'"'+((preset!=null&&+preset===n)?' class="on"':'')+'>'+n+'s</button>';
  return h+'</div>';
}
function agoText(iso){
  if(!iso) return "never";
  const d = Math.round((stripTime(new Date()) - stripTime(parseISO(iso)))/86400000);
  return d<=0 ? "today" : d===1 ? "yesterday" : d+"d ago";
}
function wireRepPads(root){
  root.querySelectorAll(".reppad").forEach(pad=>{

    html += '<div class="exbody"><div class="exname">'+esc(ex.n)+tags+'</div>';
    html += '<div class="excue">'+esc(CATS[ex.cat])+(ex.colIdx!==colIdx?' · '+esc(COLUMNS[ex.colIdx].name):'')+' · '+esc(ex.c)+'</div>';

  wrap.querySelectorAll(".edbtns [data-del]").forEach(b=> b.addEventListener("click", ()=>{
    const i=+b.getAttribute("data-del"), gone=entries.splice(i,1)[0]; savePlan(colId, entries); renderToday();

  const am = document.getElementById("addMove"); if(am) am.addEventListener("click", ()=> openExPicker(colId, -1));
  const rp = document.getElementById("resetPlan"); if(rp) rp.addEventListener("click", ()=>{

  });
  document.getElementById("editBtn").addEventListener("click", ()=>{ planEditing=!planEditing; renderToday(); });
  wrap.querySelectorAll("#focusRow button[data-f]").forEach(b=> b.addEventListener("click", ()=>{
    const fc = FOCUS.find(x=>x.id===b.getAttribute("data-f")); if(!fc || fm===fc.id) return;
    const apply = ()=>{ savePlan(colId, buildFocus(colId, fc)); planEditing=false; renderToday(); toast(fc.name+" — "+fc.cats.length+" moves"); };
    if(fm) apply(); // switching between built-in types loses nothing
    else confirmDialog("Switch to "+fc.name+"?", "This replaces your "+entries.length+" custom moves. You can still change any move afterwards.", apply, "Switch");
  }));
  wireSetupCard(colIdx);
  document.getElementById("shuffleBtn").addEventListener("click", ()=>{ shuffleKit(colId); renderToday(); toast("Rerolled — tap again for another set"); });
  document.getElementById("startSession").addEventListener("click", ()=>{ if(planEntries(colId).length) Player.startSession(colId); });
  document.getElementById("startQuick").addEventListener("click", ()=> switchTab("quick"));
}

// real session length with the current timing and moves
function sessionTotal(colIdx){
  let t=0; Player.buildSessionSteps(COLUMNS[colIdx].id).forEach(st=>{ t += st.sec||0; }); return t;
}
function setupCardHTML(){
  const w = workSec(), rs = restSec(), n = roundsN();

    '<div class="stepper"><div class="slab">'+label+'</div>'+
    '<div class="sval">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="sctl">'+

    '<button type="button" data-k="'+k+'" data-d="1" aria-label="More '+label+'"'+(val>=LIMITS[k][1]?' disabled':'')+'>+</button></div></div>';

  INTERVALS.forEach((p,i)=> h += '<button type="button" data-i="'+i+'" class="'+(p.work===w&&p.rest===rs?'on':'')+'">'+p.work+'/'+p.rest+'</button>');

function wireSetupCard(colIdx){
  const card = document.getElementById("setupCard"); if(!card) return;
  const refresh = ()=>{
    card.innerHTML = setupCardHTML(); wireSetupCard(colIdx);
    const sb = document.getElementById("startSession");
    if(sb) sb.textContent = "▶ Start · "+mmss(sessionTotal(colIdx));
    document.querySelectorAll("#view-today .typopt .tsub").forEach(x=>{ x.textContent = x.textContent.replace(/AMRAP \d+\/\d+s/, "AMRAP "+workSec()+"/"+restSec()+"s"); });
  };
  card.querySelectorAll(".stepper button").forEach(b=>{
    b.addEventListener("click", ()=>{
      const k = b.getAttribute("data-k"), d = +b.getAttribute("data-d");
      const L = LIMITS[k], v = timing(k) + d*(k==="rounds"?1:5);
      S.settings[k] = Math.max(L[0], Math.min(L[1], v)); save(); vibrate(10); refresh();
    });
  });
  card.querySelectorAll(".presets button").forEach(b=>{
    b.addEventListener("click", ()=>{ const p=INTERVALS[+b.getAttribute("data-i")]; S.settings.work=p.work; S.settings.rest=p.rest; save(); vibrate(10); refresh(); });
  });
}

// pick any move: search the whole library (every kit, every category) plus
// your own moves. idx>=0 swaps that move in the plan; idx<0 adds a new one.
function openExPicker(kitId, idx){
  const root = document.getElementById("modalRoot"); root.innerHTML="";
  const kitIdx = COLUMNS.findIndex(c=>c.id===kitId), kit = COLUMNS[kitIdx];
  const entries = planEntries(kitId);
  const cur = idx>=0 ? resolveEntry(entries[idx]) : null;
  const f = { q:"", cat:-1, eq:"" }; // -1 = all categories, 99 = mine
  const eqName = ["BW","Band","DB"];
  const back = el('<div class="modal-back picker-back"><div class="modal picker" style="--accent:'+kit.color+'">'+
    '<div class="pk-top"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h3 style="margin:0;flex:1">'+(cur ? 'Swap '+esc(cur.n) : 'Add a move')+'</h3>'+
    '<button type="button" class="icon-btn" id="pkClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
    '<input type="search" class="pk-search" id="pkQ" placeholder="Search '+(LIB_COUNT())+' moves…" autocomplete="off">'+
    '<div class="pk-chips" id="pkCats"></div><div class="pk-chips" id="pkEq"></div></div>'+
    '<div class="pk-list" id="pkList"></div>'+
    '<button type="button" class="addmove" id="pkNew" style="flex:none">＋ Create your own move</button>'+
    '</div></div>');
  root.appendChild(back); lockScroll(true);
  const close = ()=>{ root.innerHTML=""; lockScroll(false); };
  back.addEventListener("click", e=>{ if(e.target===back) close(); });
  back.querySelector("#pkClose").addEventListener("click", close);

  const choose = (ent)=>{
    const list = planEntries(kitId);
    const dup = list.findIndex((x,j)=> sameEntry(x, ent) && j!==idx);
    if(idx>=0) list[idx] = ent; else list.push(ent);
    if(dup>=0 && idx<0){ toast("Already in your workout — added again"); }
    savePlan(kitId, list); vibrate(15); close(); renderToday();
  };
  const paintChips = ()=>{
    let h = '<button type="button" data-cat="-1" class="'+(f.cat===-1?'on':'')+'">All</button>';
    CATS.forEach((c,i)=> h += '<button type="button" data-cat="'+i+'" class="'+(f.cat===i?'on':'')+'">'+esc(c)+'</button>');
    h += '<button type="button" data-cat="99" class="'+(f.cat===99?'on':'')+'">★ Mine</button>';
    back.querySelector("#pkCats").innerHTML = h;
    let e = '<button type="button" data-eq="" class="'+(f.eq===''?'on':'')+'">Any kit</button>';
    COLUMNS.forEach(c=> e += '<button type="button" data-eq="'+c.id+'" class="'+(f.eq===c.id?'on':'')+'">'+esc(c.name)+'</button>');
    back.querySelector("#pkEq").innerHTML = e;
    back.querySelectorAll("#pkCats button").forEach(b=> b.addEventListener("click", ()=>{ f.cat=+b.getAttribute("data-cat"); paintChips(); paintList(); }));
    back.querySelectorAll("#pkEq button").forEach(b=> b.addEventListener("click", ()=>{ f.eq=b.getAttribute("data-eq"); paintChips(); paintList(); }));
  };
  const rowHTML = (ent, o, ci)=>{
    const on = cur && sameEntry(cur.e, ent);
    const inPlan = !on && entries.some(x=> sameEntry(x, ent));
    const last = lastLogFor(o.n), sc = COLUMNS[ci];
    const tags = (o.d && ent.k===kitId?'<span class="extag">default</span>':'')+(o.hold?'<span class="extag">hold</span>':'')+(o.sides?'<span class="extag">sides</span>':'')+(inPlan?'<span class="extag">in workout</span>':'');
    return '<div class="pkrow'+(on?' on':'')+'" data-k="'+ent.k+'" data-r="'+(ent.r!=null?ent.r:"")+'" data-n="'+esc(ent.n)+'">'+
      movePico(o.n, ent.k==="X"?(+o.cat||0):ent.r, ci)+
      '<div class="lr-main"><div class="lr-name">'+esc(o.n)+' '+tags+'</div><div class="lr-sub">'+esc(o.c||"Your own move")+'</div>'+
      (last?'<div class="lr-sub" style="margin-top:1px">last: '+agoText(last.date)+'</div>':'')+'</div>'+
      '<span class="eqtag" style="background:'+sc.color+'">'+eqName[ci]+'</span><span class="tck">'+(on?'✓':'')+'</span></div>';
  };
  const paintList = ()=>{
    const q = f.q.trim().toLowerCase();
    const hit = o=> !q || o.n.toLowerCase().includes(q) || (o.c||"").toLowerCase().includes(q);
    let h = "";
    if(f.cat===-1 || f.cat===99){
      const mine = customMoves().filter(cm=> hit(cm) && (!f.eq || cm.eq===f.eq));
      if(mine.length){ h += '<div class="pk-h">★ Your moves</div>'; mine.forEach(cm=> h += rowHTML({k:"X", n:cm.n}, cm, Math.max(0,COLUMNS.findIndex(c=>c.id===cm.eq)))); }
    }
    if(f.cat!==99){
      // when swapping, the current move's category comes first — but every category is open
      const order = CATS.map((_,i)=>i);
      if(cur && !cur.custom){ order.splice(order.indexOf(cur.cat),1); order.unshift(cur.cat); }
      order.forEach(r=>{
        const cn = CATS[r];
        if(f.cat!==-1 && f.cat!==r) return;
        // the kit you're on first, then the others
        const kits = [kitIdx].concat(COLUMNS.map((_,i)=>i).filter(i=>i!==kitIdx));
        let part = "";
        kits.forEach(ci=>{
          const k = COLUMNS[ci].id; if(f.eq && f.eq!==k) return;
          ladder(k, r).forEach(o=>{ if(hit(o)) part += rowHTML({k, r, n:o.n}, o, ci); });
        });
        if(part) h += '<div class="pk-h">'+esc(cn)+'</div>'+part;
      });
    }
    if(!h) h = '<div class="pk-empty">Nothing matches'+(q?' “'+esc(f.q)+'”':'')+'.<br>Try “All”, or create it as your own move below.</div>';
    const list = back.querySelector("#pkList"); list.innerHTML = h;
    list.querySelectorAll(".pkrow").forEach(row=> row.addEventListener("click", ()=>{
      const k=row.getAttribute("data-k"), n=row.getAttribute("data-n");
      choose(k==="X" ? {k:"X", n} : {k, r:+row.getAttribute("data-r"), n});
    }));
  };
  back.querySelector("#pkQ").addEventListener("input", e=>{ f.q=e.target.value; paintList(); });
  back.querySelector("#pkNew").addEventListener("click", ()=> openCustomMove(kitId, f.q, f.cat>=0&&f.cat<CATS.length ? f.cat : (cur?cur.cat:0), ent=> choose(ent)));
  paintChips(); paintList();
}
function LIB_COUNT(){ let n=customMoves().length; COLUMNS.forEach(c=> LIB[c.id].forEach(l=> n+=l.length)); return n; }
// make your own move: name, category, equipment, reps or hold, one-sided
function openCustomMove(kitId, name, cat, onDone){
  const root = document.getElementById("modalRoot");
  const kit = colById(kitId);
  const st = { cat, eq:kitId, hold:false, sides:false };
  const back = el('<div class="modal-back"><div class="modal" style="max-width:430px;--accent:'+kit.color+'">'+
    '<h3>Your own move</h3>'+
    '<div class="field"><label>Name</label><input type="text" id="cmName" maxlength="40" placeholder="e.g. Sofa Tricep Dip" value="'+esc(name||"")+'"></div>'+
    '<div class="field"><label>Category</label><div class="pk-chips" id="cmCat" style="flex-wrap:wrap;padding-top:0"></div></div>'+
    '<div class="field"><label>Equipment</label><div class="seg" id="cmEq"></div></div>'+
    '<div class="field"><label>Logged as</label><div class="seg" id="cmHold"><button data-h="0">Reps</button><button data-h="1">Hold (seconds)</button></div></div>'+
    '<div class="toggle-row" style="border-bottom:0"><span>One side at a time <span class="small muted">(beep to switch halfway)</span></span><label class="switch"><input type="checkbox" id="cmSides"><span class="sl"></span></label></div>'+
    '<div class="field" style="margin-top:6px"><label>Form tip (optional)</label><input type="text" id="cmCue" maxlength="80" placeholder="What to focus on"></div>'+
    '<div class="btn-row"><button class="btn secondary" id="cmCancel">Cancel</button><button class="btn" id="cmSave" style="background:'+kit.color+'">Save &amp; add</button></div>'+
    '</div></div>');
  const prev = root.firstChild; if(prev) prev.style.display="none";
  root.appendChild(back);
  const paint = ()=>{
    back.querySelector("#cmCat").innerHTML = CATS.map((c,i)=>'<button type="button" data-c="'+i+'" class="'+(st.cat===i?'on':'')+'">'+esc(c)+'</button>').join("");
    back.querySelector("#cmEq").innerHTML = COLUMNS.map(c=>'<button type="button" data-e="'+c.id+'" class="'+(st.eq===c.id?'on':'')+'">'+esc(c.name)+'</button>').join("");
    back.querySelectorAll("#cmHold button").forEach(b=> b.classList.toggle("on", (+b.getAttribute("data-h")===1)===st.hold));
    back.querySelectorAll("#cmCat button").forEach(b=> b.addEventListener("click", ()=>{ st.cat=+b.getAttribute("data-c"); paint(); }));
    back.querySelectorAll("#cmEq button").forEach(b=> b.addEventListener("click", ()=>{ st.eq=b.getAttribute("data-e"); paint(); }));
  };
  back.querySelectorAll("#cmHold button").forEach(b=> b.addEventListener("click", ()=>{ st.hold = b.getAttribute("data-h")==="1"; paint(); }));
  paint();
  const close = ()=>{ back.remove(); if(prev) prev.style.display=""; };
  back.addEventListener("click", e=>{ if(e.target===back) close(); });
  back.querySelector("#cmCancel").addEventListener("click", close);
  back.querySelector("#cmSave").addEventListener("click", ()=>{
    const n = back.querySelector("#cmName").value.trim().replace(/\s+/g," ");
    if(!n){ toast("Give it a name"); return; }
    const all = customMoves();
    const clash = all.some(x=>x.n.toLowerCase()===n.toLowerCase()) ||
                  COLUMNS.some(c=> LIB[c.id].some(l=> l.some(o=> o.n.toLowerCase()===n.toLowerCase())));
    if(clash){ toast("There's already a move called that"); return; }
    all.push({ n, c:back.querySelector("#cmCue").value.trim(), cat:st.cat, eq:st.eq, hold:st.hold?1:0, sides:back.querySelector("#cmSides").checked?1:0 });
    save(); close(); onDone({ k:"X", n });
  });
  setTimeout(()=>{ const i=back.querySelector("#cmName"); if(i && !i.value) i.focus(); }, 50);
}

// One move, straight sets, a rest timer between. Config lives in settings.quick.
function clampInt(v,lo,hi,dflt){ v=parseInt(v,10); if(isNaN(v)) v=dflt; return Math.max(lo,Math.min(hi,v)); }
function qsConfig(){
  const d = defaultState().settings.quick;
  const q = S.settings.quick = Object.assign({}, d, S.settings.quick||{});
  if(!q.ex || !colById(q.ex.col)) q.ex = pickFromQuick(0); // push-ups
  q.sets = clampInt(q.sets,1,20,d.sets); q.reps = clampInt(q.reps,1,100,d.reps);
  q.rest = clampInt(q.rest,0,300,d.rest); q.work = clampInt(q.work,5,300,d.work);
  q.timed = !!q.timed;
  return q;
}
function qsSummary(q){
  if(q.timed){ const total = q.sets*q.work + Math.max(0,q.sets-1)*q.rest; return q.sets+' × '+q.work+'s · '+q.rest+'s rest · '+mmss(total)+' total'; }
  return q.sets+' sets × '+q.reps+(q.ex.hold?'s hold':' reps')+' · '+q.rest+'s rest between sets';
}
function renderQuick(){
  const wrap = document.getElementById("view-quick");
  const q = qsConfig(); const col = colById(q.ex.col);
  const done = quickCount(todayISO());

  let html = '<div class="section-h">Quick Session</div>';
  html += '<p class="small muted" style="margin:-4px 0 12px">One move, straight sets, a rest timer in between. Push-ups by default — or pick anything.</p>';

  // the move
  html += '<div class="card"><div class="lrow" style="border:0;padding:0 0 10px">'+movePico(q.ex.name, q.ex.cat!=null?q.ex.cat:q.ex.row, q.ex.colIdx)+
          '<div class="lr-main"><div class="lr-name">'+esc(q.ex.name)+'</div><div class="lr-sub">'+(q.ex.lt==="bw"?"bodyweight":esc(col.equipment))+'</div></div></div>';
  let chips=""; QUICK.forEach((x,i)=> chips += '<button type="button" class="qchip'+(x.n===q.ex.name?' on':'')+'" data-q="'+i+'">'+esc(x.n)+'</button>');
  html += '<div class="qchips" style="margin-bottom:8px">'+chips+'</div>';
  html += '<div class="field" style="margin-bottom:0"><select id="qsSel">'+libraryOptions()+'</select></div></div>';

  // the sets
  html += '<div class="section-h">Sets</div><div class="card">';
  html += '<div class="qchips">';
  QS_PRESETS.forEach(p=>{
    const on = !q.timed && q.sets===p.sets && q.reps===p.reps && q.rest===p.rest;
    html += '<button type="button" class="qchip'+(on?' on':'')+'" data-preset="'+p.id+'">'+p.sets+'×'+p.reps+' · '+p.rest+'s</button>';
  });
  html += '</div>';
  html += '<div class="field"><label>Set type</label><div class="seg" id="qsMode"><button data-m="reps" class="'+(q.timed?"":"on")+'">Reps</button><button data-m="timed" class="'+(q.timed?"on":"")+'">Timed</button></div></div>';
  html += '<div class="qsgrid">';
  html += '<div class="field"><label>Sets</label><input type="number" inputmode="numeric" id="qsSets" min="1" max="20" value="'+q.sets+'"></div>';
  if(q.timed) html += '<div class="field"><label>Work (s)</label><input type="number" inputmode="numeric" id="qsWork" min="5" max="300" value="'+q.work+'"></div>';
  else        html += '<div class="field"><label>'+(q.ex.hold?'Target (s)':'Reps')+'</label><input type="number" inputmode="numeric" id="qsReps" min="1" max="100" value="'+q.reps+'"></div>';
  html += '<div class="field"><label>Rest (s)</label><input type="number" inputmode="numeric" id="qsRest" min="0" max="300" value="'+q.rest+'"></div>';
  html += '</div>';
  html += '<div class="inline-note" style="margin-top:0">'+esc(qsSummary(q))+'</div>';
  html += '</div>';

  html += '<div class="btn-row" style="margin-top:12px"><button class="btn" id="qsStart" style="background:'+col.color+'">▶ Start quick session</button></div>';
  html += '<p class="small muted" style="text-align:center;margin-top:10px">'+done+' quick session'+(done===1?"":"s")+' logged today · 3 make a full day</p>';

  wrap.innerHTML = html;

  const commit = ()=>{ save(); renderQuick(); };
  wrap.querySelectorAll(".qchip[data-q]").forEach(ch=> ch.addEventListener("click", ()=>{ q.ex = pickFromQuick(+ch.getAttribute("data-q")); commit(); }));
  wrap.querySelector("#qsSel").addEventListener("change", e=>{ if(!e.target.value) return; q.ex = pickFromLibraryValue(e.target.value); commit(); });
  wrap.querySelectorAll(".qchip[data-preset]").forEach(ch=> ch.addEventListener("click", ()=>{
    const p = QS_PRESETS.find(x=>x.id===ch.getAttribute("data-preset")); if(!p) return;
    q.sets=p.sets; q.reps=p.reps; q.rest=p.rest; q.timed=false; commit();
  }));
  wrap.querySelectorAll("#qsMode button").forEach(b=> b.addEventListener("click", ()=>{ q.timed = b.getAttribute("data-m")==="timed"; commit(); }));
  [["qsSets","sets",1,20],["qsReps","reps",1,100],["qsWork","work",5,300],["qsRest","rest",0,300]].forEach(f=>{
    const inp = wrap.querySelector("#"+f[0]); if(!inp) return;
    inp.addEventListener("change", ()=>{ q[f[1]] = clampInt(inp.value, f[2], f[3], q[f[1]]); commit(); });
  });
  wrap.querySelector("#qsStart").addEventListener("click", ()=> Player.startQuick());
}

function renderPRs(){

  const rows = names.map(n=>({ n, b:bestSet(n) })).filter(x=>x.b).sort((a,b)=> b.b.e-a.b.e);
  if(!rows.length){ card.innerHTML = '<p class="muted small" style="margin:0">Log a set with weight and reps — your best lifts land here.</p>'; return; }
  card.innerHTML = rows.slice(0,12).map(x=>{
    const lt=x.b.lt, w=fmtWeight(x.b.w,lt);

  let pick = null;
  function setPick(p){
    pick = p;
    back.querySelectorAll(".qchip").forEach(x=> x.classList.remove("on"));
    if(p.chip!=null){ const c=back.querySelector('.qchip[data-q="'+p.chip+'"]'); if(c) c.classList.add("on"); }
    wWrap.style.display = p.lt==="bw" ? "none" : "flex";

    prev.innerHTML = movePico(p.name, p.cat!=null?p.cat:p.row, p.colIdx) + '<div class="lr-main"><div class="lr-name">'+esc(p.name)+'</div><div class="lr-sub">'+(p.lt==="bw"?"bodyweight":esc(COLUMNS[p.colIdx].equipment))+'</div></div>';
  }
  back.querySelectorAll(".qchip").forEach(ch=> ch.addEventListener("click", ()=>{
    const i=+ch.getAttribute("data-q"); sel.value="";
    setPick(Object.assign(pickFromQuick(i), { chip:i }));
  }));
  sel.addEventListener("change", ()=>{
    if(!sel.value) return;
    setPick(Object.assign(pickFromLibraryValue(sel.value), { chip:null }));
  });
  back.querySelector("#qSave").addEventListener("click", ()=>{
    if(!pick){ toast("Pick a move first"); return; }
    const pad = back.querySelector(".reppad"); const reps = (pad && pad.dataset.val) ? +pad.dataset.val : 0;
    const w = (pick.lt!=="bw" && back.querySelector("#qW").value!=="") ? +back.querySelector("#qW").value : 0;
    if(reps<=0 && w<=0){ toast("Tap how many reps"); return; }
    const iso = todayISO();
    const log = { date:iso, col:pick.col, mode:"quick", exercise:pick.name, sets:[{ w, r:reps }] };
    S.logs.push(log);
    const prs = detectPRs([log]); save(); checkAchievements(); save(); close();
    toast(prs.length ? ("🏆 New PR: "+pick.name) : ("Logged "+pick.name+(reps?" ×"+reps:"")));
    refreshActive();
  });
}
function renderHistBody(name){
  const body = document.getElementById("histBody");
  if(!body) return;
  const logs = S.logs.filter(l=>l.exercise===name);
  let html = "";
  // sparkline of est volume
  const vols = logs.map(l=> l.sets.reduce((a,s)=> a + (+s.w||0)*(+s.r||0), 0));
  const anyW = vols.some(v=>v>0);
  if(logs.length>=2 && anyW){
    const w=280,h=36, max=Math.max.apply(null,vols)||1, min=Math.min.apply(null,vols);
    const pts = vols.map((v,i)=>{
      const x = logs.length>1 ? (i/(logs.length-1))*w : 0;
      const y = h - 4 - ((v-min)/((max-min)||1))*(h-8);
      return x.toFixed(1)+","+y.toFixed(1);
    }).join(" ");
    html += '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--plateD)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    html += '<div class="small muted" style="margin-bottom:8px">Estimated volume (weight × reps)</div>';
  }
  logs.slice().reverse().forEach(l=>{
    const sets = l.sets.map(s=> fmtSet(s, loadType(colById(l.col)))).join("  ");
    html += '<div class="histlog"><span>'+sets+'</span><span class="hdate">'+esc(l.date)+' · '+esc(l.col)+'</span></div>';
  });
  body.innerHTML = html;
}

/* ================================================================= TABS & TOASTS */
function switchTab(tab){
  ["today","quick","progress","settings"].forEach(t=>{
    document.getElementById("view-"+t).hidden = (t!==tab);
  });
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-tab")===tab);
  });
  if(tab==="today") renderToday();
  if(tab==="quick") renderQuick();
  if(tab==="progress") renderProgress();
  if(tab==="settings") renderSettings();
  window.scrollTo(0,0);
}
function toast(msg){
  const t = el('<div style="position:fixed;left:50%;bottom:calc(80px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;z-index:80;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)">'+esc(msg)+'</div>');
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, 1600);
}
function confirmDialog(title, body, onYes, yesLabel){
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
  const back = el('<div class="modal-back"><div class="modal"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><div class="btn-row"><button class="btn secondary" id="mNo">Cancel</button><button class="btn danger" id="mYes">'+esc(yesLabel||"Confirm")+'</button></div></div></div>');
  root.appendChild(back);
  const close = ()=> root.innerHTML="";
  back.addEventListener("click", e=>{ if(e.target===back) close(); });
  back.querySelector("#mNo").addEventListener("click", close);
  back.querySelector("#mYes").addEventListener("click", ()=>{ close(); onYes && onYes(); });
}

/* ================================================================= PLAYER (state machine) */
const Player = {
  active:false, steps:[], idx:0, colId:null, colIdx:0, mode:"session",
  startTs:0, dur:0, paused:false, pausedAt:0, pauseAccum:0, raf:0, quick:null,
  ended:false,

  buildSessionSteps(colId){
    const colIdx = COLUMNS.indexOf(colById(colId));
    const moves = planMoves(colId), rounds = roundsN(), work = workSec(), rest = restSec();
    const steps = [];
    for(let round=1; round<=rounds; round++){
      moves.forEach((ex,k)=>{
        steps.push({ type:"exercise", round, rounds, mi:k, ex, pos:k+1, of:moves.length, colIdx, sec:work, sides:ex.sides });
        const lastOfRound = (k===moves.length-1), lastOfAll = lastOfRound && round===rounds;
        if(lastOfAll) return;
        if(lastOfRound) steps.push({ type:"rest", sec:Math.max(rest,BREAK_SEC), label:(round*2===rounds?"Halfway · breathe":"Round break · breathe") });
        else if(rest>0) steps.push({ type:"rest", sec:rest, label:"Rest" });
      });
    }
    steps.push({ type:"summary" });
    return steps;
  },
  // quick session: N straight sets of one move. Rep sets count up until you
  // tap Done; timed sets count down like the main session.
  buildQuickSteps(q){
    const steps = [];
    for(let set=1; set<=q.sets; set++){
      steps.push({ type:"exercise", quick:true, round:set, sec: q.timed ? q.work : 0, countUp: !q.timed, sides: q.timed && !!q.ex.sides });
      if(set<q.sets && q.rest>0) steps.push({ type:"rest", sec:q.rest, label:"Rest" });
    }
    steps.push({ type:"summary" });
    return steps;
  },

  startSession(colId){ this._start(colId, "session", this.buildSessionSteps(colId)); },
  startQuick(){ const q = qsConfig(); this.quick = q; this._start(q.ex.col, "quick", this.buildQuickSteps(q)); },

  _start(colId, mode, steps){
    this.active=true; this.ended=false; this.mode=mode; this.colId=colId; this.colIdx=COLUMNS.indexOf(colById(colId));
    this.steps=steps; this.idx=0; this.moves=planMoves(colId); this.rounds=roundsN();
    document.documentElement.classList.toggle("reduced", matchMedia("(prefers-reduced-motion: reduce)").matches);
    requestWake();
    try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); AC.resume&&AC.resume(); }catch(e){}
    this.renderShell();
    this.enter(0);
  },
  enter(i){
    this.idx=i;
    const step = this.steps[i];
    if(!step){ this.finish(); return; }
    if(step.type==="summary"){ this.finish(); return; }
    this.startTs = Date.now(); this.dur = step.sec; this.paused=false; this.pauseAccum=0;
    if(step.type==="rest" || i===0) cueChime();
    this.renderStep();
    this.loop();
  },
  elapsed(){
    if(this.paused) return (this.pausedAt - this.startTs - this.pauseAccum)/1000;
    return (Date.now() - this.startTs - this.pauseAccum)/1000;
  },
  remaining(){ return this.dur - this.elapsed(); },
  loop(){
    cancelAnimationFrame(this.raf);
    const tick = ()=>{
      if(!this.active) return;
      const rem = this.remaining();
      this.paint(rem);
      const step = this.steps[this.idx];
      // 3-2-1 ticks before every timed interval ends
      if(step.sec>0 && !step.countUp){
        const sc = Math.ceil(rem);
        if(sc>=1 && sc<=3 && step._tick!==sc){ step._tick=sc; beep(600,0.06,0); vibrate(25); }
      }
      if(rem<=0 && step.type==="rest"){
        cueRestEnd(); vibrate([80,60,80]);
        this.next(true); return;
      }
      // timed work intervals move on by themselves — no tap needed
      if(rem<=0 && step.type==="exercise" && !step.countUp && step.sec>0){
        beep(760,0.14,0); beep(560,0.18,0.16); vibrate([60,40,60]);
        this.next(true); return;
      }
      if(step.type==="exercise" && step.sides && !step._half && step.sec>0 && this.elapsed() >= step.sec/2){
        step._half=true; beep(600,0.1,0); beep(600,0.1,0.15); vibrate([60,40,60]);
        const sw = document.getElementById("pSwitch"); if(sw){ sw.textContent="Switch sides ▸"; sw.classList.add("now"); }
      }
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  },
  paint(rem){
    const ring = document.getElementById("ringProg");
    const timeEl = document.getElementById("ringTime");
    const step = this.steps[this.idx];
    const countUp = !!(step && step.countUp);
    if(timeEl) timeEl.textContent = mmss(countUp ? this.elapsed() : rem);
    if(ring){
      const C = 2*Math.PI*52;
      const frac = countUp ? 1 : Math.max(0, Math.min(1, rem/this.dur));
      ring.style.strokeDasharray = C;
      ring.style.strokeDashoffset = C*(1-frac);
    }
  },
  next(auto){
    const step=this.steps[this.idx];
    if(step){ step._half=false; step._tick=null; }
    this.enter(this.idx+1);
  },
  skip(){ this.enter(this.idx+1); },
  add30(){ this.dur += 30; this.paint(this.remaining()); },
  togglePause(){
    if(this.paused){
      this.pauseAccum += (Date.now() - this.pausedAt);
      this.paused=false; this.loop();
    } else {
      this.paused=true; this.pausedAt=Date.now();
      cancelAnimationFrame(this.raf);
    }
    this.renderControls();
  },
  exit(){
    confirmDialog("Exit workout?","Your progress in this session won't be saved.", ()=>{
      this.teardown();
    });
  },
  teardown(){
    this.active=false; cancelAnimationFrame(this.raf); releaseWake();
    document.getElementById("overlayRoot").innerHTML="";
  },

  renderShell(){
    const col = colById(this.colId);
    const root = document.getElementById("overlayRoot");
    root.innerHTML = "";
    const ov = el('<div class="overlay" style="--accent:'+col.color+'"></div>');
    ov.innerHTML =
      '<div class="obar"><button class="icon-btn" id="pExit" aria-label="Exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
      '<div class="phase" id="pPhase" style="color:'+col.color+'"></div>'+
      '<button class="icon-btn" id="pMute" aria-label="Mute"></button></div>'+
      '<div id="pStage"></div>';
    root.appendChild(ov);
    ov.querySelector("#pExit").addEventListener("click", ()=>this.exit());
    const mute = ov.querySelector("#pMute");
    const paintMute=()=>{ mute.innerHTML = S.settings.sound
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>'; };
    paintMute();
    mute.addEventListener("click", ()=>{ S.settings.sound=!S.settings.sound; save(); paintMute(); if(S.settings.sound) cueChime(); });
  },
  renderStep(){
    const step=this.steps[this.idx];
    const col = colById(this.colId);
    const phase = document.getElementById("pPhase");
    const stage = document.getElementById("pStage");
    const q = this.quick;
    let phaseLabel="";
    if(step.type==="rest") phaseLabel = step.label || "Rest";
    else if(step.type==="exercise") phaseLabel = this.mode==="quick" ? ("Set "+step.round+" of "+q.sets) : ("Round "+step.round+" of "+step.rounds+" · "+step.pos+"/"+step.of);
    phase.textContent = phaseLabel;

    let html = '<div class="ring-wrap"><div class="ring"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="prog" id="ringProg" cx="60" cy="60" r="52" style="stroke:'+col.color+'"/></svg>';
    html += '<div class="center"><div class="time" id="ringTime">'+mmss(step.sec)+'</div><div class="sub">'+esc(phaseLabel)+'</div></div></div></div>';

    if(step.type==="exercise" && step.quick){
      html += '<div class="player-ex">'+movePico(q.ex.name, q.ex.cat!=null?q.ex.cat:q.ex.row, q.ex.colIdx, "pbig");
      html += '<div class="pname">'+esc(q.ex.name)+'</div>';
      html += '<div class="pcue">'+(q.timed ? "Keep going until the timer ends" : "Tap Done when the set is finished")+'</div>';
      html += '<div class="ptarget" style="color:'+col.color+'">'+(q.timed ? (q.work+'s work') : (q.reps+(q.ex.hold?'s hold':' reps')))+' · '+q.sets+' sets</div>';
      if(step.sides) html += '<div class="pswitch" id="pSwitch">Switch sides at '+mmss(Math.floor(step.sec/2))+'</div>';
      html += '</div>';
    } else if(step.type==="exercise"){
      const ex = step.ex;
      const t = computeTarget(ex);
      const wtxt = t.lt==="bw" ? "Bodyweight" : (t.weight!=null ? fmtWeight(t.weight,t.lt) : "pick a weight");
      html += '<div class="player-ex">'+exPico(ex, "pbig");
      html += '<div class="pname">'+esc(ex.n)+'</div>';
      html += '<div class="pcue">'+esc(ex.c)+'</div>';
      html += '<div class="ptarget" style="color:'+col.color+'">'+(t.hold?'HOLD':'AMRAP')+' · '+esc(wtxt)+(t.beat!=null?' · beat '+t.beat+(t.hold?'s':''):'')+(t.sug?' · ↑ '+esc(t.sug):'')+'</div>';
      if(step.sides) html += '<div class="pswitch" id="pSwitch">Switch sides at '+mmss(Math.floor(step.sec/2))+'</div>';
      html += '</div>';
    } else if(step.type==="rest"){
      const nextStep = this.steps[this.idx+1];
      let up="";
      if(nextStep && nextStep.type==="exercise") up = nextStep.quick ? ("Next: set "+nextStep.round+" of "+q.sets) : ("Next: "+nextStep.ex.n);
      html += '<div class="player-ex"><div class="pname">'+esc(step.label||"Rest")+'</div><div class="pcue">'+esc(up)+'</div></div>';
    }

    // controls
    html += '<div class="player-ctrls" id="pCtrls"></div>';
    stage.innerHTML = html;
    this.renderControls();
    this.paint(step.sec);
  },
  renderControls(){
    const c = document.getElementById("pCtrls");
    if(!c) return;
    const step=this.steps[this.idx];
    const last = this.steps[this.idx+1] && this.steps[this.idx+1].type==="summary";
    const nextLabel = step.type==="rest" ? "Skip rest" :
                      step.quick ? (last ? "Finish" : "Done") : "Done early";
    const countUp = !!step.countUp; // rep-based set: no clock to extend
    c.innerHTML =
      '<button class="btn secondary" id="cPause">'+(this.paused?"Resume":"Pause")+'</button>'+
      (countUp ? '' : '<button class="btn secondary" id="cAdd">+30s</button>')+
      '<button class="btn'+(countUp?'':' wide')+'" id="cNext" style="background:'+colById(this.colId).color+'">'+nextLabel+' ▸</button>';
    c.querySelector("#cPause").addEventListener("click", ()=>this.togglePause());
    if(!countUp) c.querySelector("#cAdd").addEventListener("click", ()=>this.add30());
    c.querySelector("#cNext").addEventListener("click", ()=>this.skip());
  },

  finish(){
    this.active=false; cancelAnimationFrame(this.raf); releaseWake();
    cueChime(); vibrate([100,50,100]);
    if(this.mode==="quick") this.finishQuick();
    else this.finishSession();
  },
  finishSession(){
    const col = colById(this.colId); const colIdx=this.colIdx;
    const root = document.getElementById("overlayRoot"); root.innerHTML="";
    const ov = el('<div class="overlay" style="--accent:'+col.color+'"></div>');
    let html = '<div class="obar"><div class="phase" style="flex:1;color:'+col.color+'">Session complete</div></div>';
    html += '<div style="text-align:center;margin:8px 0 4px"><div style="font-size:42px">✅</div><h2 style="font-size:20px;margin-top:4px">Nice work</h2><p class="muted small">Log your AMRAP sets — weight is pre-filled, enter your reps.</p></div>';
    html += '<div class="card" style="margin-bottom:14px">';
    this.moves.forEach((ex,k)=>{
      const t = computeTarget(ex);
      html += '<div class="log-ex" data-mi="'+k+'" data-hold="'+(ex.hold?1:0)+'"><div class="lname">'+(k+1)+'. '+esc(ex.n)+'</div>';
      for(let s=0;s<this.rounds;s++){
        const wv = t.lt==="bw" ? "" : (t.weight!=null?t.weight:"");
        html += '<div class="lset"><div class="lshead"><span class="setn">Set '+(s+1)+'</span>'+
                (t.lt==="bw" ? '<span class="small muted">bodyweight</span>'
                             : '<input type="number" inputmode="decimal" class="w" placeholder="'+S.settings.units+'" value="'+wv+'">')+
                '<span class="small muted">'+(ex.hold?'seconds held → tap':'reps → tap')+'</span></div>'+ (ex.hold ? secPad(null) : repPad(null)) +'</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="player-ctrls"><button class="btn secondary wide" id="skipLog">Skip logging</button><button class="btn wide" id="saveLog" style="background:'+col.color+'">Save session</button></div>';
    ov.innerHTML = html; root.appendChild(ov); wireRepPads(ov);

    ov.querySelector("#saveLog").addEventListener("click", ()=>{
      const iso = todayISO(); const added=[];
      ov.querySelectorAll(".log-ex").forEach(node=>{
        const ex = this.moves[+node.getAttribute("data-mi")], exName = ex.n;
        const hold = node.getAttribute("data-hold")==="1";
        const sets = [];
        node.querySelectorAll(".lset").forEach(ls=>{
          const wi = ls.querySelector("input.w"), pad = ls.querySelector(".reppad");
          const w = (wi && wi.value!=="") ? +wi.value : 0;
          const v = (pad && pad.dataset.val) ? +pad.dataset.val : 0;
          if(w>0 || v>0) sets.push(hold ? { w, r:0, sec:v } : { w, r:v });
        });
        // a log's kit is the move's own kit, so weights / band levels format right
        if(sets.length){ const log={ date:iso, col:COLUMNS[ex.colIdx].id, mode:"session", row:ex.cat, exercise:exName, sets }; S.logs.push(log); added.push(log); }
      });
      S.sessionsDone[iso] = this.colId;
      const prs = detectPRs(added); save(); checkAchievements(); save();
      this.teardown();
      toast(prs.length ? ("🏆 New PR: "+prs[0]) : "Session saved 💪"); switchTab("today");
    });
    ov.querySelector("#skipLog").addEventListener("click", ()=>{
      S.sessionsDone[todayISO()] = this.colId; save(); checkAchievements(); save();
      this.teardown(); toast("Marked complete"); switchTab("today");
    });
  },
  finishQuick(){
    const q = this.quick; const col = colById(q.ex.col);
    const root = document.getElementById("overlayRoot"); root.innerHTML="";
    const ov = el('<div class="overlay" style="--accent:'+col.color+'"></div>');
    let html = '<div class="obar"><div class="phase" style="flex:1;color:'+col.color+'">Quick session done</div></div>';
    html += '<div style="text-align:center;margin:8px 0 4px"><div style="font-size:40px">⚡</div><h2 style="font-size:18px;margin-top:4px">'+esc(q.ex.name)+'</h2><p class="muted small">'+esc(qsSummary(q))+'. Adjust anything you missed, then save.</p></div>';
    html += '<div class="card" style="margin-bottom:14px"><div class="log-ex" style="border:0">';
    for(let s=0;s<q.sets;s++){
      html += '<div class="lset"><div class="lshead"><span class="setn">Set '+(s+1)+'</span>'+
              (q.ex.lt==="bw" ? '<span class="small muted">bodyweight</span>'
                              : '<input type="number" inputmode="decimal" class="w" placeholder="'+S.settings.units+'">')+
              '<span class="small muted">'+(q.timed ? (q.work+'s'+(q.ex.hold?'':' · reps optional')) : (q.ex.hold?'seconds held → tap':'reps → tap'))+'</span></div>'+
              (q.timed && q.ex.hold ? '' : q.ex.hold ? secPad(null) : repPad(q.timed ? null : q.reps)) +'</div>';
    }
    html += '</div></div>';
    html += '<div class="player-ctrls"><button class="btn secondary wide" id="skipLog">Discard</button><button class="btn wide" id="saveLog" style="background:'+col.color+'">Save quick session</button></div>';
    ov.innerHTML = html; root.appendChild(ov); wireRepPads(ov);

    ov.querySelector("#saveLog").addEventListener("click", ()=>{
      const iso=todayISO(); const sets=[];
      ov.querySelectorAll(".lset").forEach(ls=>{
        const wi=ls.querySelector("input.w"), pad=ls.querySelector(".reppad");
        const w=(wi&&wi.value!=="")?+wi.value:0;
        const v=(pad&&pad.dataset.val)?+pad.dataset.val:0;
        const set = q.ex.hold ? { w, r:0, sec:(q.timed?q.work:v) } : { w, r:v };
        if(!q.ex.hold && q.timed) set.sec = q.work;
        if(w>0||v>0||q.timed) sets.push(set);
      });
      if(!sets.length){ toast("Tap the reps for at least one set"); return; }
      const log={ date:iso, col:q.ex.col, mode:"quick", exercise:q.ex.name, sets };
      S.logs.push(log);
      const prs=detectPRs([log]); save(); checkAchievements(); save(); this.teardown();
      const n = quickCount(iso);
      toast(prs.length ? ("🏆 New PR: "+q.ex.name) : (n>=3 ? "Quick session "+n+" — day complete! 🔥" : ("Quick session "+n+" saved ⚡")));
      switchTab("quick");
    });
    ov.querySelector("#skipLog").addEventListener("click", ()=>{ this.teardown(); switchTab("quick"); });
  }
};

/* ================================================================= INIT */
function init(){
  load();
  applyTheme();
  checkAchievements(true); save(); // record already-earned badges silently
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click", ()=> switchTab(b.getAttribute("data-tab")));
  });
  document.getElementById("gearBtn").addEventListener("click", ()=> switchTab("settings"));
  document.getElementById("fabQuick").addEventListener("click", openQuickLog);
  switchTab("today");

  // re-render Today if the day changed while the app stayed open
  let lastDay = todayISO();
  setInterval(()=>{
    const now = todayISO();
    if(now!==lastDay){ lastDay=now; if(!Player.active){ switchTab("today"); } }
  }, 60000);

  // service worker: only when hosted over https
  if(location.protocol==="https:" && "serviceWorker" in navigator){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
  }
}
init();
})();
